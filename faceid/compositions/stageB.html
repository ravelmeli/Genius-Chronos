    (function () {
      var HF = window.HF, lerp = HF.lerp, ease = HF.ease, easeOut = HF.easeOut, seg = HF.seg, $ = HF.el;

      var scene = new THREE.Scene();

      scene.add(new THREE.HemisphereLight(0x6f8cff, 0x0a0c14, 0.2));

      var face = HF.makeFace();
      face.group.position.set(0, 0.2, 0);
      scene.add(face.group);
      face.mat.color.set(0x8f93a6);
      var K = 0.35;
      // dim reference grid (where the dots would land on a flat wall)
      var refGeo = new THREE.BufferGeometry();
      var ra = new Float32Array(face.n * 3), rc = new Float32Array(face.n * 3);
      for (var i = 0; i < face.n; i++) { ra[i * 3] = face.tx[i]; ra[i * 3 + 1] = face.ty[i]; ra[i * 3 + 2] = -0.02; rc[i * 3] = 0.55; rc[i * 3 + 1] = 0.58; rc[i * 3 + 2] = 0.7; }
      refGeo.setAttribute("position", new THREE.BufferAttribute(ra, 3));
      refGeo.setAttribute("color", new THREE.BufferAttribute(rc, 3));
      var refMat = new THREE.PointsMaterial({ size: 0.04, map: HF.spriteTex, vertexColors: true, transparent: true, opacity: 0, depthWrite: false, toneMapped: false });
      var ref = new THREE.Points(refGeo, refMat);
      ref.frustumCulled = false;
      face.group.add(ref);
      // the photo
      var pc = document.createElement("canvas");
      pc.width = 340; pc.height = 440;
      var g = pc.getContext("2d");
      g.fillStyle = "#f4f4f6"; g.fillRect(0, 0, 340, 440);
      g.fillStyle = "#c98f6b"; g.beginPath(); g.ellipse(170, 215, 112, 150, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#2b2420"; g.beginPath(); g.ellipse(170, 120, 112, 60, 0, Math.PI, 0); g.fill();
      g.fillStyle = "#1b1f2e"; g.beginPath(); g.ellipse(130, 195, 16, 9, 0, 0, Math.PI * 2); g.ellipse(210, 195, 16, 9, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "#9a6a4c"; g.lineWidth = 6; g.beginPath(); g.moveTo(170, 200); g.lineTo(160, 255); g.lineTo(180, 258); g.stroke();
      g.strokeStyle = "#7a3f3a"; g.lineWidth = 7; g.beginPath(); g.moveTo(135, 305); g.quadraticCurveTo(170, 325, 205, 305); g.stroke();
      var ptex = new THREE.CanvasTexture(pc); ptex.encoding = THREE.sRGBEncoding;
      var photo = new THREE.Mesh(new THREE.PlaneGeometry(1.75, 2.26), new THREE.MeshBasicMaterial({ map: ptex, transparent: true, opacity: 0, toneMapped: false }));
      photo.position.set(0, 0, -0.01);
      face.group.add(photo);
      // two highlighted dots (near = nose tip, far = cheek edge)
      function nearest(x, y) { var b = 0, bd = 9; for (var q = 0; q < face.n; q++) { var d = (face.tx[q] - x) * (face.tx[q] - x) + (face.ty[q] - y) * (face.ty[q] - y); if (d < bd) { bd = d; b = q; } } return b; }
      var iN = nearest(0, -0.28), iF = nearest(0.58, -0.1);
      var gN = HF.makeGlow(0xffd23a, 0.45), gF = HF.makeGlow(0xffd23a, 0.45);
      face.group.add(gN); face.group.add(gF);
      var tmp = new THREE.Vector3();
      function proj(x, y, z) { tmp.set(x, y, z); face.group.localToWorld(tmp); return HF.project(camera, tmp); }
      var ldNear = $("fb-ld-near"), ldFar = $("fb-ld-far");
      var labNear = $("fb-lab-near"), labFar = $("fb-lab-far");

      function depthColor(z, o, mix) {
        var u = HF.clamp(z / 0.7, 0, 1);
        var r = u > 0.6 ? lerp(0.3, 1, (u - 0.6) / 0.4) : lerp(0.23, 0.3, u / 0.6);
        var gg = u > 0.6 ? 1 : lerp(0.4, 0.9, u / 0.6);
        var b = 1;
        o.r = lerp(o.r, r, mix); o.g = lerp(o.g, gg, mix); o.b = lerp(o.b, b, mix);
      }
      function renderAt(t) {
        if (t < T0 - 0.05 || t > T1 + 0.05) return;
        var fl = ease(seg(t, 28.9, 31.5));
        var rise = ease(seg(t, 35.4, 38.5));
        var toPhoto = ease(seg(t, 42.8, 43.5));
        var colorMix = ease(seg(t, 35.5, 37.2)) * (1 - toPhoto);
        face.dmat.opacity = 1;
        face.setDots(function (i, o) {
          var z = face.tz[i], x = face.tx[i], y = face.ty[i];
          var ax = x + K * z;
          var px = lerp(x, ax, fl), pz = lerp(z, 0, fl);
          px = lerp(px, x, rise); pz = lerp(pz, z, rise);
          px = lerp(px, x, toPhoto); pz = lerp(pz, 0.012, toPhoto);
          o.x = px; o.y = y; o.z = pz;
          o.v = 0.8 + 0.2 * Math.sin(t * 8 + face.hs[i] * 30);
          depthColor(z, o, colorMix);
          if (normal) { o.r = 0.5; o.g = 0.12; o.b = 1; o.v = 1; }
        });
        var normal = t >= 42.8;
        var wantBlend = normal ? THREE.NormalBlending : THREE.AdditiveBlending;
        if (face.dmat.blending !== wantBlend) { face.dmat.blending = wantBlend; face.dmat.needsUpdate = true; }
        face.mat.opacity = lerp(1, 0.0, ease(seg(t, 28.9, 29.9))) * (1 - toPhoto) + (t >= 35.4 ? 0.0 : 0);
        face.mat.visible = face.mat.opacity > 0.01;
        for (var e = 0; e < 2; e++) face.eyes[e].visible = face.mat.visible;
        face.wmat.opacity = ease(seg(t, 38.0, 40.5)) * (1 - toPhoto);
        refMat.opacity = 0.45 * ease(seg(t, 30.0, 31.0)) * (1 - ease(seg(t, 35.4, 36.2)));
        photo.material.opacity = ease(seg(t, 43.0, 43.6)) * (1 - ease(seg(t, 47.0, 47.4)));
        face.group.rotation.y = t > 38.4 && t < 42.8 ? 0.5 * Math.sin((t - 38.4) * 1.1) * ease(seg(t, 38.4, 39.4)) : 0.0;
        var k = ease(seg(t, T0, T1));
        camera.position.set(0, 0.3, lerp(lerp(4.9, 4.4, k), 6.6, toPhoto));
        camera.lookAt(0, 0.25, 0);
        camera.updateMatrixWorld();
        // highlighted dots and displacement lines during the flat phase
        var show = ease(seg(t, 32.0, 32.5)) * (1 - ease(seg(t, 34.9, 35.4)));
        var zN = face.tz[iN], zF = face.tz[iF];
        var apN = [face.tx[iN] + K * zN, face.ty[iN], 0], rfN = [face.tx[iN], face.ty[iN], -0.02];
        var apF = [face.tx[iF] + K * zF, face.ty[iF], 0], rfF = [face.tx[iF], face.ty[iF], -0.02];
        gN.position.set(apN[0], apN[1], 0.02); gF.position.set(apF[0], apF[1], 0.02);
        gN.material.opacity = show; gF.material.opacity = show;
        var a1 = proj(apN[0], apN[1], 0), b1 = proj(rfN[0], rfN[1], -0.02);
        var a2 = proj(apF[0], apF[1], 0), b2 = proj(rfF[0], rfF[1], -0.02);
        HF.place(labNear, a1.x + 70, a1.y - 190, false);
        HF.place(labFar, a2.x + 50, a2.y + 200, false);
        HF.setLeader(ldNear, b1.x, b1.y, a1.x, a1.y, show);
        HF.setLeader(ldFar, b2.x, b2.y, a2.x, a2.y, show);
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", function (e) { renderAt(e.detail.time); });
      renderAt(T0);

      var tl = gsap.timeline({ paused: true });
      var pop = function (sel, at) { tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, at); };
      pop("#fb-lab-near", 3.40); pop("#fb-lab-far", 4.40); pop("#fb-depth", 9.80);
      tl.fromTo("#fb-legend", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.40);

    })();
