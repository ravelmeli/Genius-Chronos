  <script src="assets/vendor/three.min.js"></script>

  <script src="assets/face.js"></script>
  <script>

    (function () {
      var HF = window.HF, lerp = HF.lerp, ease = HF.ease, easeOut = HF.easeOut, seg = HF.seg, $ = HF.el;
      var T0 = 47.4, T1 = 82.96;
      var renderer = HF.makeRenderer($("fc-canvas"));
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x04060d);
      scene.fog = new THREE.Fog(0x04060d, 8, 22);
      var camera = new THREE.PerspectiveCamera(38, HF.W / HF.H, 0.1, 50);
      scene.add(new THREE.HemisphereLight(0x6f8cff, 0x0a0c14, 0.2));
      var keyL = new THREE.DirectionalLight(0x9bb8ff, 0.5);
      keyL.position.set(1.5, 2, 4);
      scene.add(keyL);
      var rim = new THREE.DirectionalLight(0x5aa0ff, 0.5);
      rim.position.set(-3, 2.5, -3);
      scene.add(rim);
      var face = HF.makeFace();
      face.group.position.set(0, 0.1, 0);
      scene.add(face.group);
      face.mat.color.set(0x8f93a6);
      var eg = [HF.makeGlow(0x38d27a, 0.5), HF.makeGlow(0x38d27a, 0.5)];
      eg.forEach(function (e, i) { e.position.set((i ? 1 : -1) * 0.28, 0.2, HF.fz(0.28, 0.2) + 0.12); face.group.add(e); });
      var rnd = HF.mulberry32(11);
      var drift = [];
      for (var i = 0; i < face.n; i++) drift.push([(rnd() - 0.5) * 0.6, -2.2 - rnd() * 2.2, (rnd() - 0.5) * 0.6, rnd()]);

      function depthRGB(z, o) {
        var u = HF.clamp(z / 0.7, 0, 1);
        o.r = u > 0.6 ? lerp(0.3, 1, (u - 0.6) / 0.4) : lerp(0.23, 0.3, u / 0.6);
        o.g = u > 0.6 ? 1 : lerp(0.4, 0.9, u / 0.6);
        o.b = 1;
      }
      function pop(obj, t, t0) { var s = easeOut(seg(t, t0, t0 + 0.3)); obj.visible = s > 0.01; obj.scale.setScalar(Math.max(0.01, s)); }

      function renderAt(t) {
        if (t < T0 - 0.05 || t > T1 + 0.05) return;
        // layout weight: 1 = small face on top (cards below), 0 = big face
        var w = 1 - ease(seg(t, 57.0, 57.8)) + ease(seg(t, 65.5, 66.2));
        w = HF.clamp(w, 0, 1);
        face.group.scale.setScalar(lerp(1, 0.68, w));
        camera.position.set(0, lerp(0.3, -1.4, w), lerp(4.9, 8.2, w));
        camera.lookAt(0, lerp(0.3, -1.4, w), 0);
        face.group.rotation.y = 0.25 * Math.sin(t * 0.7);
        face.glasses.visible = false; face.hat.visible = false; face.beard.visible = false;
        face.dmat.blending = THREE.AdditiveBlending;
        var mesh = 0, wire = 0, dotsOp = 0, eyesOpen = 1, eyeGlow = 0, eyeCol = 0;

        if (t < 57.0) { // S6 : depth map becomes numbers
          wire = 0.9 * (1 - ease(seg(t, 50.3, 51.6)));
          mesh = 0;
          dotsOp = 1 - ease(seg(t, 53.6, 55.2));
          face.setDots(function (i, o) {
            var z = face.tz[i];
            var e = ease(seg(t, 50.4 + drift[i][3] * 2.6, 52.6 + drift[i][3] * 2.6));
            o.x = lerp(face.tx[i], face.tx[i] + drift[i][0], e); o.y = lerp(face.ty[i], face.ty[i] + drift[i][1], e); o.z = lerp(z, z + drift[i][2], e);
            depthRGB(z, o); o.v = 1;
          });
          for (var q = 0; q < 2; q++) face.eyes[q].visible = false;
        } else {
          for (var q2 = 0; q2 < 2; q2++) face.eyes[q2].visible = true;
        }
        if (t >= 56.8 && t < 65.7) { // S7 : compare and adapt
          mesh = ease(seg(t, 56.8, 57.6));
          wire = 0.55 * ease(seg(t, 57.5, 58.1));
          dotsOp = ease(seg(t, 58.2, 58.8));
          face.setDots(function (i, o) { o.x = face.tx[i]; o.y = face.ty[i]; o.z = face.tz[i]; o.r = 0.7; o.g = 0.42; o.b = 1; o.v = 0.55 + 0.45 * Math.sin(t * 9 + face.hs[i] * 40); });
          pop(face.glasses, t, 61.2); pop(face.hat, t, 62.3); pop(face.beard, t, 63.7);
        }
        if (t >= 65.7 && t < 71.0) { // S8 : attention
          mesh = 1; wire = 0.18 * (1 - ease(seg(t, 65.7, 66.4)));
          dotsOp = 0.0;
          eyesOpen = 1 - ease(seg(t, 69.5, 69.8));
          eyeGlow = 0.8 * ease(seg(t, 65.9, 66.3));
          eyeCol = ease(seg(t, 69.5, 69.8));
        }
        if (t >= 71.0) { // S9, S10
          mesh = t < 78.0 ? 1 : 0.55;
          wire = t < 78.0 ? 0.45 : 0.9;
          dotsOp = t >= 78.0 ? ease(seg(t, 78.2, 79.0)) : 0;
          if (t >= 78.0) {
            face.setDots(function (i, o) { var z = face.tz[i]; o.x = face.tx[i]; o.y = face.ty[i]; o.z = z; depthRGB(z, o); o.v = 0.7 + 0.3 * Math.sin(t * 6 + face.hs[i] * 30); });
          }
        }
        face.mat.opacity = mesh; face.mat.visible = mesh > 0.01;
        face.wmat.opacity = wire;
        face.dmat.opacity = dotsOp;
        face.setEyes(eyesOpen);
        for (var k = 0; k < 2; k++) { eg[k].material.opacity = eyeGlow * eyesOpen; eg[k].material.color.setRGB(lerp(0.22, 1, eyeCol), lerp(0.82, 0.29, eyeCol), lerp(0.48, 0.29, eyeCol)); }

        // numbers (deterministic: depend on the time slot only)
        if (t >= 50.4 && t < 56.8) {
          var slot = Math.floor(t * 6);
          for (var r = 0; r < 3; r++) {
            var rr = HF.mulberry32(slot * 7 + r * 131), line = "";
            for (var c = 0; c < 3; c++) { var v = (rr() * 2 - 1) * 1.6; line += (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(3) + (c < 2 ? "  " : ""); }
            $("fc-r" + r).textContent = line;
          }
        }
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", function (e) { renderAt(e.detail.time); });
      renderAt(T0);

      var tl = gsap.timeline({ paused: true });
      var popd = function (sel, at) { tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, at); };
      var card = function (sel, at) { tl.fromTo(sel, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, at); };
      popd("#fc-noimg", 0.40);
      card("#fc-num", 3.00);
      tl.fromTo("#fc-chip", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.00);
      tl.fromTo("#fc-chiplab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.20);
      tl.fromTo("#fc-lockbig", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 0.8, duration: 0.3, ease: "back.out(2)" }, 6.80);
      popd("#fc-lab-ref", 9.90); popd("#fc-lab-live", 11.00);
      popd("#fc-p-gl", 13.80); popd("#fc-p-ha", 14.90); popd("#fc-p-be", 16.30); popd("#fc-adapt", 16.90);
      card("#fc-ok", 18.50); card("#fc-no", 22.10);
      card("#fc-bars", 23.90);
      tl.fromTo("#fc-b1", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.out" }, 24.40);
      tl.fromTo("#fc-row2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 28.60);
      tl.fromTo("#fc-b2", { scaleX: 0 }, { scaleX: 0.66, duration: 0.9, ease: "power2.out" }, 28.80);
      popd("#fc-sel", 24.60);
      tl.fromTo("#fc-end1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 33.05);
      tl.fromTo("#fc-end2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 34.45);
      window.__timelines["stageC"] = tl;
    })();

  </script>
