      var rim = new THREE.DirectionalLight(0x5aa0ff, 0.9); rim.position.set(-3, 3, -4); scene.add(rim);

      var hob = HF.makeHob(); scene.add(hob.group);
      var pan = HF.makePan(); scene.add(pan.group); pan.group.position.y = 0.06;
      var field = HF.makeField(1.0); scene.add(field.group);
      var eddy = HF.makeEddy(); eddy.group.position.y = 0.12; scene.add(eddy.group);
      var fl = new THREE.PointLight(0xffffff, 0.5, 40); fl.position.set(0, 6, 6); scene.add(fl);
      var heatGlow = HF.makeGlow(0xff7a1a, 2.6); heatGlow.position.set(0, 0.15, 0); scene.add(heatGlow);
      function panHeat(h) { pan.baseMat.emissiveIntensity = 1.6 * h; heatGlow.material.opacity = 0.55 * h; }

      // compare set (x = 60): classic hob next to induction hob
      var cmp = new THREE.Group(); cmp.position.set(60, 0, 0); cmp.scale.setScalar(0.62); scene.add(cmp);
      var cl = HF.makeClassicHob(); cl.group.position.x = -1.95; cmp.add(cl.group);
      var clPan = HF.makePan(); clPan.group.position.set(-1.95, 0.06, 0); clPan.baseMat.emissiveIntensity = 0.9; cmp.add(clPan.group);
      var ih = HF.makeHob(); ih.group.position.x = 1.95; ih.glassMat.opacity = 0.97; cmp.add(ih.group);
      var ihPan = HF.makePan(); ihPan.group.position.set(1.95, 0.06, 0); ihPan.baseMat.emissiveIntensity = 1.3; cmp.add(ihPan.group);
      var clGlow = HF.makeGlow(0xff3a1a, 3.2); clGlow.position.set(-1.95, 0.2, 0); cmp.add(clGlow);
      // pans set (x = -60): magnetic and non-magnetic pans
      var ps = new THREE.Group(); ps.position.set(-60, 0, 0); scene.add(ps);
      var slab = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.5, 2.8), HF.std(0x0b101c, { roughness: 0.6, metalness: 0.4 })); slab.position.y = -0.25; ps.add(slab);
      var slabTop = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.05, 2.8), HF.std(0x141c30, { roughness: 0.12, metalness: 0.5 })); slabTop.position.y = 0.025; ps.add(slabTop);
      var pL = HF.makePan(), pR = HF.makePan();
      pL.group.scale.setScalar(0.8); pR.group.scale.setScalar(0.8); pL.group.position.set(-1.35, 0.05, 0); pR.group.position.set(1.35, 0.05, 0);
      pL.water.visible = false; pR.water.visible = false; pL.bubbles.visible = false; pR.bubbles.visible = false; pL.steam.visible = false; pR.steam.visible = false;
      pR.baseMat.color.setHex(0xe8d6c0); pR.wallMat.color.setHex(0xe8d6c0);
      ps.add(pL.group); ps.add(pR.group);
      var mg = HF.makeMagnet(); mg.scale.setScalar(1.6); mg.rotation.z = Math.PI / 2; ps.add(mg);
      var xr = new THREE.Group(); xr.position.set(1.35, 0.9, 1.5); ps.add(xr);
      var kC = [{ t: 0, p: [60, 3.0, 10.4], l: [60, -0.2, 0] }];
      var kP = [{ t: 0, p: [-60, 3.0, 13.4], l: [-60, -0.9, 0] }];
      var kM = [{ t: 0, p: [3.4, 3.0, 5.0], l: [0, 0.0, 0] }];
      function renderAt(t) {
        if (t < T0 - 0.05 || t > T1 + 0.05) return;
        var sC = t < 61.9, sP = t >= 61.9 && t < 73.4, sM = t >= 73.4;
        cmp.visible = sC; ps.visible = sP;
        hob.group.visible = sM; pan.group.visible = sM; field.group.visible = sM; eddy.group.visible = sM; heatGlow.visible = sM;
        if (sC) {
          var warm = ease(seg(t, 58.0, 61.0));
          ih.glassMat.emissive.setHex(0xff7a1a); ih.glassMat.emissiveIntensity = 0.28 * warm;
          clGlow.material.opacity = 0.55 + 0.1 * Math.sin(t * 5);
          cl.mat.emissiveIntensity = 1.0;
          HF.updateParticles(clPan.steam, t, 0.0, 1, 1); HF.updateParticles(ihPan.steam, t, 0.0, 1, 1);
          clPan.water.visible = false; ihPan.water.visible = false; clPan.bubbles.visible = false; ihPan.bubbles.visible = false;
          HF.camKeys(camera, kC, t, 0.05);
        } else if (sP) {
          var mx = lerp(-3.9, -2.7, ease(seg(t, 67.0, 67.6)));
          var lift = 1.6 * ease(seg(t, 69.8, 71.0));
          pL.group.position.y = 0.05 + lift;
          pL.baseMat.emissiveIntensity = 0.7 * (1 - ease(seg(t, 69.8, 71.0)));
          mg.position.set(mx, 0.38 + lift, 0);
          xr.visible = false;
          HF.camKeys(camera, kP, t, 0.05);
        } else {
          hob.glassMat.opacity = 0.26;
          pan.group.position.y = 0.06; pan.water.visible = false; pan.bubbles.visible = false; pan.wallMat.opacity = 0.3;
          HF.updateField(field, t, 1.0);
          eddy.group.position.y = 0.12; HF.updateEddy(eddy, t, 1.0);
          HF.updateCoil(hob, t, 0.9); panHeat(0.85);
          HF.updateParticles(pan.steam, t, 0, 1, 1);
          HF.camKeys(camera, kM, t, 0.05);
        }
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", function (e) { renderAt(e.detail.time); });
      renderAt(T0);
      var tl = gsap.timeline({ paused: true });
      var popd = function (sel, at, dd) { tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: dd || 0.25, ease: "back.out(2)" }, at); };
      ["#id-lab-cold|1.10", "#id-lab-classic|2.70", "#id-lab-little|3.80", "#id-lab-contact|5.80", "#id-lab-notall|8.80", "#id-lab-mag|11.20", "#id-lab-nomag|11.80", "#id-lab-magnet|13.10", "#id-lab-removed|15.40", "#id-lab-nocur|16.80", "#id-lab-noheat|18.10", "#id-lab-coil|19.60", "#id-lab-field|20.70", "#id-lab-eddy|21.80", "#id-q1|25.20", "#id-q2|25.40", "#id-b1|27.40", "#id-b2|28.40"].forEach(function (q) { var a = q.split("|"); popd(a[0], parseFloat(a[1])); });
