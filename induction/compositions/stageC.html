  <script>

    (function () {
      var HF = window.HF, lerp = HF.lerp, ease = HF.ease, easeOut = HF.easeOut, seg = HF.seg, $ = HF.el;
      var T0 = 32.5, T1 = 54.2;

      var renderer = HF.makeRenderer($("ic-canvas"));
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070b16);
      scene.fog = new THREE.Fog(0x070b16, 12, 34);
      var camera = new THREE.PerspectiveCamera(38, HF.W / HF.H, 0.1, 80);
      scene.add(new THREE.HemisphereLight(0x6f8cff, 0x120c08, 0.6));
      var key = new THREE.DirectionalLight(0xffe2c0, 1.0); key.position.set(3, 5, 3); scene.add(key);
      var rim = new THREE.DirectionalLight(0x5aa0ff, 0.9); rim.position.set(-3, 3, -4); scene.add(rim);

      var hob = HF.makeHob(); scene.add(hob.group);
      var pan = HF.makePan(); scene.add(pan.group); pan.group.position.y = 0.06;
      var field = HF.makeField(1.0); scene.add(field.group);
      var eddy = HF.makeEddy(); eddy.group.position.y = 0.12; scene.add(eddy.group);
      var fl = new THREE.PointLight(0xffffff, 0.5, 40); fl.position.set(0, 6, 6); scene.add(fl);
      var heatGlow = HF.makeGlow(0xff7a1a, 2.6); heatGlow.position.set(0, 0.15, 0); scene.add(heatGlow);
      function panHeat(h) { pan.baseMat.emissiveIntensity = 1.6 * h; heatGlow.material.opacity = 0.55 * h; }

      var keys = [{ t: 0, p: [3.6, 3.3, 5.4], l: [0, -0.1, 0] }, { t: 37.0, p: [2.9, 2.6, 4.2], l: [0, 0.1, 0] }];
      function renderAt(t) {
        if (t < T0 - 0.05 || t > T1 + 0.05) return;
        hob.glassMat.opacity = 0.26;
        var drop = ease(seg(t, 32.8, 33.7));
        pan.group.position.y = 0.06 + 1.6 * (1 - drop);
        pan.group.visible = t >= 32.8;
        pan.wallMat.opacity = lerp(1, 0.3, ease(seg(t, 36.0, 37.0)));
        pan.water.visible = false; pan.bubbles.visible = false;
        var fv = 0.75 + 0.25 * ease(seg(t, 35.0, 35.6));
        field.group.visible = true; HF.updateField(field, t, fv);
        var ev = ease(seg(t, 38.8, 39.8));
        eddy.group.visible = ev > 0; eddy.group.position.y = pan.group.position.y + 0.06; HF.updateEddy(eddy, t, ev);
        HF.updateCoil(hob, t, 0.9);
        var h = ease(seg(t, 47.4, 50.6));
        panHeat(h);
        var cool = ease(seg(t, 52.8, 53.6));
        hob.glassMat.emissiveIntensity = 0.35 * cool;
        HF.updateParticles(pan.steam, t, 0, 1, 1); 
        HF.camKeys(camera, keys, t, 0.05);
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", function (e) { renderAt(e.detail.time); });
      renderAt(T0);
      var tl = gsap.timeline({ paused: true });
      var popd = function (sel, at, dd) { tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: dd || 0.25, ease: "back.out(2)" }, at); };
      ["#ic-lab-metal|1.20", "#ic-lab-thru|2.90", "#ic-lab-cur|6.50", "#ic-lab-foucault|8.70", "#ic-lab-circle|11.00", "#ic-lab-res|13.50", "#ic-lab-heat|15.10", "#ic-lab-inpan|18.90", "#ic-lab-notplate|20.70"].forEach(function (q) { var a = q.split("|"); popd(a[0], parseFloat(a[1])); });
      window.__timelines["stageC"] = tl;
