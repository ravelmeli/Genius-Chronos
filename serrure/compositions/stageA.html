  <script>

    (function () {
      var HF = window.HF, lerp = HF.lerp, ease = HF.ease, easeOut = HF.easeOut, seg = HF.seg, $ = HF.el;
      var T0 = 0, T1 = 10.0;
      function w(t, a, b) { return ease(seg(t, a, a + 0.25)) * (1 - ease(seg(t, b - 0.25, b))); }

      var renderer = HF.makeRenderer($("sa-canvas"));
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070b16);
      scene.fog = new THREE.Fog(0x070b16, 12, 34);
      var camera = new THREE.PerspectiveCamera(38, HF.W / HF.H, 0.1, 80);
      scene.add(new THREE.HemisphereLight(0x6f8cff, 0x120c08, 0.6));
      var key = new THREE.DirectionalLight(0xffe2c0, 1.0); key.position.set(3, 5, 3); scene.add(key);
      var rim = new THREE.DirectionalLight(0x5aa0ff, 0.9); rim.position.set(-3, 3, -4); scene.add(rim);

      var fl = new THREE.PointLight(0xffffff, 0.6, 50); fl.position.set(0, 5, 10); scene.add(fl);
      var lock = HF.makeLock(); scene.add(lock.group);
      var NP = 5;
      function pins() { var a = []; for (var i = 0; i < NP; i++) a.push({ s: 0, set: 0, bind: 0 }); return a; }
      var keys = [{ t: 0, p: [-1.6, 1.9, 16.2], l: [0, -0.75, 0] }];

      function renderAt(t) {
        if (t > T1 + 0.05) return;
        var st = { t: t, pin: pins() };
        var ang = ease(seg(t, 4.6, 5.5)) * 1.4 * (1 - ease(seg(t, 6.4, 7.2)));
        st.plugAng = ang;
        var ss = ease(seg(t, 3.2, 4.4)) * (1 - ease(seg(t, 6.4, 6.8)));
        st.pin.forEach(function (q, i) { q.set = ss; q.s = HF.LOCK.r[i] * ss; });
        st.pickOn = t > 0.5 && t < 9.2; st.pickX = lerp(-4.6, 0.3, ease(seg(t, 0.6, 3.0))) + 0.5 * Math.sin(t * 2); st.pickY = -0.95 + 0.04 * Math.sin(t * 9);
        st.wrenchOn = t > 2.3 && t < 9.2; st.arrowOn = w(t, 3.0, 5.2);
        HF.updateLock(lock, st);
        HF.camKeys(camera, keys, t, 0.05);
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", function (e) { renderAt(e.detail.time); });
      renderAt(T0);
      var tl = gsap.timeline({ paused: true });
      var popd = function (sel, at, dd) { tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: dd || 0.25, ease: "back.out(2)" }, at); };
      ["#sa-lab-tool|0.9", "#sa-lab-flat|2.3", "#sa-lab-open|5.0", "#sa-lab-mag|6.7", "#sa-lab-clear|8.7"].forEach(function (q) { var a = q.split("|"); popd(a[0], parseFloat(a[1])); });
      window.__timelines["stageA"] = tl;
    })();
