    <div id="aa-tag-b" class="aa-mono clip" data-start="11.5" data-duration="16.1" style="left: 60px; top: 200px"><span class="aa-dot"></span>L'ACCÉLÉROMÈTRE</div>
    <div id="aa-illu" class="aa-mono clip" data-start="0.3" data-duration="27.2" style="right: 60px; top: 190px; padding: 6px 16px; border-radius: 999px; background: rgba(10,16,32,0.6)">ILLUSTRATIF</div>
    <div id="aa-ms" class="clip" data-start="2.6" data-duration="3.2"><span id="aa-msn">0</span> ms<small>AU RALENTI</small></div>

      <div class="bar" style="top: 212px"><div id="aa-b2" class="fill" style="background: #fff"></div></div>
      <div class="val" style="top: 252px; font-size: 32px; color: rgba(255,255,255,0.8)">bien plus long</div>
    </div>
    <div id="aa-q1" class="aa-q clip" data-start="8.12" data-duration="3.1" style="left: 130px; top: 480px">?</div>
    <div id="aa-q2" class="aa-q clip" data-start="8.3" data-duration="2.9" style="left: 830px; top: 620px">?</div>
    <div id="aa-q3" class="aa-q clip" data-start="8.5" data-duration="2.7" style="left: 360px; top: 880px">?</div>

      <div id="aa-g-ch" class="aa-gchip clip" data-start="21.0" data-duration="6.6" style="left: 520px; background: #ff4a4a; color: #fff">CHOC : ÉNORME</div>

  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/airbag.js"></script>
  <script>

    (function () {
      var HF = window.HF, lerp = HF.lerp, ease = HF.ease, easeOut = HF.easeOut, seg = HF.seg, $ = HF.el;
      var T1 = 27.7;
      var renderer = HF.makeRenderer($("aa-canvas"));
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070b16);
      scene.fog = new THREE.Fog(0x070b16, 10, 26);
      var camera = new THREE.PerspectiveCamera(38, HF.W / HF.H, 0.1, 60);
      scene.add(new THREE.HemisphereLight(0x6f8cff, 0x120c08, 0.45));
      var key = new THREE.DirectionalLight(0xffd9b0, 1.0);
      key.position.set(2.5, 4, 3);
      scene.add(key);
      var rim = new THREE.DirectionalLight(0x5aa0ff, 1.0);
      rim.position.set(-3, 2.5, -3);
      scene.add(rim);
      var flashL = new THREE.PointLight(0xffd9a0, 0, 8, 1.4);
      scene.add(flashL);

      // ---------- exterior crash ----------
      var gE = new THREE.Group();
      scene.add(gE);
      var ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 14), new THREE.MeshStandardMaterial({ color: 0x141a2a, roughness: 0.9 }));
      ground.rotation.x = -Math.PI / 2;
      gE.add(ground);
      for (var i = -8; i < 6; i++) { var dash = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.01, 0.12), new THREE.MeshBasicMaterial({ color: 0xcfd3dc })); dash.position.set(i * 1.5, 0.01, 1.9); gE.add(dash); }
      var wall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.4, 3.6), new THREE.MeshStandardMaterial({ color: 0xa6adbf, roughness: 0.8, flatShading: true }));
      wall.position.set(2.9, 1.2, 0);
      gE.add(wall);
      for (var s = 0; s < 4; s++) { var st = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.28, 3.62), new THREE.MeshBasicMaterial({ color: s % 2 ? 0xffffff : 0xff4a3a })); st.position.set(2.9, 0.25 + s * 0.3, 0); st.visible = false; gE.add(st); }
      var car = HF.makeCar();
      gE.add(car);
      var flash = HF.makeGlow(0xffe2a0, 3.2);
      flash.position.set(2.6, 0.6, 0.2);
      gE.add(flash);

      // ---------- interior ----------
      var gI = new THREE.Group();
      scene.add(gI);
      gI.add(HF.makeCabin());
      var dummy = HF.makeDummy();
      dummy.group.position.set(-1.3, 0.05, 0);
      gI.add(dummy.group);
      var wheel = HF.makeWheel();
      var hub = new THREE.Vector3(-0.35, 0.28, 0);
      wheel.position.copy(hub);
      gI.add(wheel);
      var bag = HF.makeBag();
      gI.add(bag);
      var bagGlow = HF.makeGlow(0xffffff, 2.2);
      gI.add(bagGlow);

      // ---------- accelerometer ----------
      var gS = new THREE.Group();
      scene.add(gS);
      var base = new THREE.Mesh(HF.roundedBox(2.0, 1.4, 0.1, 0.08, 0.02), new THREE.MeshStandardMaterial({ color: 0x1b2238, roughness: 0.6, metalness: 0.3 }));
      gS.add(base);
      var copper = new THREE.MeshStandardMaterial({ color: 0xd98a4a, metalness: 0.8, roughness: 0.35 });
      var elL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.9, 0.16), copper); elL.position.set(-0.78, 0, 0.12);
      var elR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.9, 0.16), copper); elR.position.set(0.78, 0, 0.12);
      gS.add(elL, elR);
      var fingers = [];
      for (var f = 0; f < 5; f++) {
        var fl = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.1), copper); fl.position.set(-0.64, -0.36 + f * 0.18, 0.12); gS.add(fl);
        var fr = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.1), copper); fr.position.set(0.64, -0.27 + f * 0.18, 0.12); gS.add(fr);
      }
      var massMat = new THREE.MeshStandardMaterial({ color: 0xc9ccd8, metalness: 0.7, roughness: 0.3, emissive: 0xff5a00, emissiveIntensity: 0 });
      var mass = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.8, 0.16), massMat);
      mass.position.set(0, 0, 0.16);
      gS.add(mass);
      var mfingers = [];
      for (var m = 0; m < 5; m++) {
        var a = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.05, 0.1), massMat); a.position.set(-0.4, -0.31 + m * 0.18, 0.16); mass.add(a); a.position.set(-0.43, -0.31 + m * 0.18 + 0.0, 0); mfingers.push(a);
        var b = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.05, 0.1), massMat); b.position.set(0.43, -0.22 + m * 0.18, 0); mass.add(b); mfingers.push(b);
      }
      function zig(x0, x1, y) {
        var pts = [], n = 10;
        for (var i2 = 0; i2 <= n; i2++) pts.push(new THREE.Vector3(lerp(x0, x1, i2 / n), y + (i2 % 2 ? 0.07 : -0.07) * (i2 === 0 || i2 === n ? 0 : 1), 0.16));
        return pts;
      }
      var springs = [];
      [-0.3, 0.3].forEach(function (y) {
        [[-1], [1]].forEach(function (sd) {
          var geo = new THREE.BufferGeometry().setFromPoints(zig(0, 1, y));
          var ln = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffc41a }));
          ln.userData = { side: sd[0], y: y };
          gS.add(ln); springs.push(ln);
        });
      });
      var glowS = HF.makeGlow(0xff7a1a, 3.4);
      glowS.position.set(0, 0, 0.5);
      gS.add(glowS);

      function acc(t) {
        var a = 0.03 * Math.sin(t * 3.1);
        if (t >= 18.6 && t < 20.7) a = 0.28 * Math.sin(Math.PI * (t - 18.6) / 2.1);
        if (t >= 21.3) { var u = t - 21.3; a = 1.0 * Math.min(1, u / 0.08) * Math.exp(-u * 0.6) + 0.04 * Math.sin(t * 3.1); }
        return a;
      }
      var curve = $("aa-curve");
      function graphD(t) {
        var d = "M 0 250", t0 = 14.8, t1 = 27.7;
        for (var u = t0; u <= Math.min(t, t1); u += 0.1) { var x = (u - t0) / (t1 - t0) * 828, y = 250 - acc(u) * 210; d += " L " + x.toFixed(1) + " " + y.toFixed(1); }
        return d;
      }
      var labMass = $("aa-lab-mass"), labSpring = $("aa-lab-spring");
      var ldMass = $("aa-ld-mass"), ldSpring = $("aa-ld-spring");
      var tmp = new THREE.Vector3();
      function projW(v) { tmp.copy(v); gS.localToWorld(tmp); return HF.project(camera, tmp); }

      function renderAt(t) {
        if (t > T1 + 0.05) return;
        var inE = t < 3.0, inI = t >= 3.0 && t < 11.3, inS = t >= 11.3;
        gE.visible = inE; gI.visible = inI; gS.visible = inS;
        flashL.intensity = 0;
        ldMass.setAttribute("opacity", "0"); ldSpring.setAttribute("opacity", "0");
        if (inE) {
          var u = HF.clamp(t / 2.4, 0, 1);
          var carx = lerp(-3.4, 1.05, Math.pow(u, 1.15));
          var post = ease(seg(t, 2.4, 2.6));
          car.position.set(carx - 0.12 * post, 0, 0);
          car.scale.x = 1 - 0.08 * post;
          flash.material.opacity = 0.95 * Math.exp(-Math.max(0, t - 2.4) * 4.5) * (t >= 2.4 ? 1 : 0);
          flashL.position.set(2.5, 0.8, 1.2); flashL.intensity = flash.material.opacity * 3;
          var shake = t >= 2.4 && t < 3.0 ? Math.sin(t * 60) * 0.06 * (1 - seg(t, 2.4, 3.0)) : 0;
          camera.position.set(0.3 + shake, 1.2, 12.5);
          camera.lookAt(0.3, -0.9, 0);
        }
        if (inI) {
          var lt = t - 3.0;
          var p = ease(seg(t, 3.0, 3.5));
          var def = ease(seg(t, 6.2, 10.0)) * 0.55;
          HF.setBag(bag, p * (1 - def), hub);
          bagGlow.material.opacity = 0.5 * Math.exp(-Math.max(0, t - 3.5) * 3) * (t >= 3.0 ? 1 : 0);
          bagGlow.position.copy(bag.position);
          var lean = ease(seg(t, 3.3, 6.0)) * 0.3;
          dummy.group.position.set(-1.3 + lean, 0.05 - 0.04 * lean, 0);
          dummy.group.rotation.z = -0.25 * ease(seg(t, 3.3, 6.0));
          var k = ease(seg(t, 3.0, 11.3));
          camera.position.set(lerp(1.0, 0.7, k), 0.7, lerp(4.6, 4.1, k));
          camera.lookAt(-0.7, 0.15, 0);
        }
        if (inS) {
          gS.scale.setScalar(0.94 + 0.06 * easeOut(seg(t, 11.3, 11.75)));
          var a = acc(t);
          var off = HF.clamp(-0.55 * a, -0.6, 0.6) + (t >= 21.3 ? 0.07 * Math.exp(-(t - 21.3) * 3) * Math.sin(38 * (t - 21.3)) : 0);
          mass.position.x = off;
          massMat.emissiveIntensity = 0.6 * HF.clamp(a, 0, 1);
          glowS.material.opacity = 0.5 * HF.clamp(a - 0.3, 0, 1);
          springs.forEach(function (ln) {
            var pa = ln.geometry.attributes.position;
            var xa = ln.userData.side * 0.52, xb = ln.userData.side * 0.76;
            var inner = ln.userData.side * 0.31 + off;
            var from = ln.userData.side < 0 ? -0.76 : 0.31 + off, to = ln.userData.side < 0 ? -0.31 + off : 0.76;
            for (var i3 = 0; i3 <= 10; i3++) pa.setXYZ(i3, lerp(from, to, i3 / 10), ln.userData.y + (i3 % 2 ? 0.06 : -0.06) * (i3 === 0 || i3 === 10 ? 0 : 1), 0.16);
            pa.needsUpdate = true;
          });
          camera.position.set(0.3 * Math.sin(t * 0.5), -1.24, 6.5);
          camera.lookAt(0, -1.24, 0);
          camera.updateMatrixWorld();
          var pm = projW(new THREE.Vector3(off, 0.3, 0.2));
          HF.place(labMass, pm.x + 220, pm.y - 150, false);
          HF.leader(camera, "aa-ld-mass", labMass, tmp.set(off, 0.3, 0.2).applyMatrix4(gS.matrixWorld), 15.0, 27.7, t);
          var ps = projW(new THREE.Vector3(-0.55, 0.3, 0.2));
          HF.place(labSpring, ps.x - 40, ps.y - 200, true);
          HF.leader(camera, "aa-ld-spring", labSpring, tmp.set(-0.55, 0.3, 0.2).applyMatrix4(gS.matrixWorld), 16.2, 27.7, t);
          curve.setAttribute("d", graphD(t));
        }
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", function (e) { renderAt(e.detail.time); });
      renderAt(0);

      var tl = gsap.timeline({ paused: true });
      var pop = function (sel, at, d) { tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: d || 0.25, ease: "back.out(2)" }, at); };
      var card = function (sel, at) { tl.fromTo(sel, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, at); };
      tl.fromTo("#aa-ms", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 2.6);
      var cnt = { v: 0 };
      tl.to(cnt, { v: 30, duration: 0.5, ease: "none", onUpdate: function () { var n = $("aa-msn"); if (n) n.textContent = Math.round(cnt.v); } }, 3.0);
      card("#aa-bars", 5.9);
      tl.fromTo("#aa-b1", { scaleX: 0 }, { scaleX: 0.12, duration: 0.4, ease: "power2.out" }, 6.2);
      tl.fromTo("#aa-b2", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.out" }, 6.7);
      pop("#aa-q1", 8.12, 0.3); pop("#aa-q2", 8.3, 0.3); pop("#aa-q3", 8.5, 0.3);
      pop("#aa-lab-mass", 15.0); pop("#aa-lab-spring", 16.2);
      card("#aa-graph", 14.8);
      pop("#aa-g-fr", 18.6); pop("#aa-g-ch", 21.0);
      window.__timelines["stageA"] = tl;
    })();

  </script>
</template>
