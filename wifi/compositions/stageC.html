      function traffic(t, ct, pl, rate, vis) {

          var dv = DEV[i], s = ct[i] == null ? 0 : ease(seg(t, ct[i], ct[i] + 0.35)); dv.visible = s > 0.01; dv.position.copy(devPos(i)); dv.scale.setScalar(Math.max(0.01, s) * (i < NIN ? 1 : 0.78));

          var dp = devPos(i), R = new THREE.Vector3(RX, RY, 0.05);
          if (p >= 0 && p <= pe) { pk.visible = true; pk.position.copy(dp).lerp(R, p); pk.rotation.set(t * 3, t * 2, 0); pk.scale.setScalar(i < NIN ? 1 : 0.8); }

        var cg = (t > 24.0 && t < 25.7); if (cg) { pa.visible = pb.visible = false; }
