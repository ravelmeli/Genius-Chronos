  <script src="assets/vendor/three.min.js"></script>

    (function () {

      var T1 = 20.5;

      function std(c, o) { return new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.7, metalness: 0.1 }, o || {})); }

      var g = new THREE.Group(); scene.add(g);
      var floor = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.12, 2.4), std(0x1a2236)); floor.position.y = -0.06; g.add(floor);
      var walls = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.5, 2.4), new THREE.MeshStandardMaterial({ color: 0x5a6a90, transparent: true, opacity: 0.12, side: THREE.DoubleSide }));
      walls.position.y = 0.75; g.add(walls);
      var roofMat = new THREE.MeshStandardMaterial({ color: 0x8892a8, roughness: 0.9, transparent: true, opacity: 0.7 });
      var roof = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.28, 2.6), roofMat); roof.position.y = 1.64; g.add(roof);
      var wallEdges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(3.4, 1.5, 2.4)), new THREE.LineBasicMaterial({ color: 0x9aa6c4, transparent: true, opacity: 0.55 }));
      wallEdges.position.y = 0.75; g.add(wallEdges);
      var fig = HF.makeFigure(); fig.position.set(0, 0, 0.1); g.add(fig);
      var pGlow = HF.makeGlow(0x4aa8ff, 0.9); pGlow.position.set(0.12, 0.32, 0.25); g.add(pGlow);
      var shelf1 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 0.3), std(0x2b3350)); shelf1.position.set(-1.0, 0.2, -0.6); g.add(shelf1);
      var shelf2 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 0.3), std(0x2b3350)); shelf2.position.set(0.9, 0.2, 0.7); g.add(shelf2);
      var sats = [], lines = [];

      for (var i = 0; i < 3; i++) {
        var s = HF.makeSatellite(); s.position.set(sp[i][0], sp[i][1], sp[i][2]); s.rotation.y = 0.6; g.add(s); sats.push(s);
        var up = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(sp[i][0], sp[i][1], sp[i][2]), new THREE.Vector3(roofPts[i][0], roofPts[i][1], roofPts[i][2])]), new THREE.LineBasicMaterial({ color: 0xffc41a, transparent: true, opacity: 0 }));
        var dn = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(roofPts[i][0], 1.5, roofPts[i][2]), new THREE.Vector3(roofPts[i][0] * 0.3, 0.45, 0.2)]), new THREE.LineBasicMaterial({ color: 0xffc41a, transparent: true, opacity: 0 }));

      }
      var noS = HF.makeGlow(0xff4a4a, 1.3); noS.position.set(0.4, 5.6, -1.4); g.add(noS);

      var labWeak = $("ga-lab-weak"), labConc = $("ga-lab-conc");

      function renderAt(t) {
        if (t > T1 + 0.05) return;
        g.scale.setScalar(0.94 + 0.06 * easeOut(seg(t, 0, 0.5)));
        for (var i = 0; i < 3; i++) {
          sats[i].position.y = sp[i][1] + 0.08 * Math.sin(t * 0.8 + i);
          sats[i].rotation.y = 0.6 + 0.1 * Math.sin(t * 0.5 + i);
          var f = ease(seg(t, 10.2 + i * 0.25, 11.0 + i * 0.25));

          lines[i][1].material.opacity = 0.07 * f * (1 - 0.5 * ease(seg(t, 14.7, 15.6)));
        }
        noS.material.opacity = 0.5 * ease(seg(t, 1.0, 1.6)) * (1 - ease(seg(t, 10.0, 10.6)));

      pop("#ga-q1", 8.0, 0.3); pop("#ga-q2", 8.2, 0.3);
      pop("#ga-lab-weak", 12.7); pop("#ga-lab-conc", 14.7); pop("#ga-lab-other", 17.9);
