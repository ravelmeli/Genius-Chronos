    <canvas id="ga-canvas" width="1080" height="1920"></canvas>
    <div id="ga-tag-a" class="ga-mono clip" data-start="0.3" data-duration="7.9" style="left: 60px; top: 200px"><span class="ga-dot"></span>L'ÉLECTRICITÉ</div>
    <div id="ga-illu" class="ga-mono clip" data-start="0.3" data-duration="8.0" style="right: 60px; top: 190px; padding: 6px 16px; border-radius: 999px; background: rgba(10,16,32,0.6)">ILLUSTRATIF</div>

    <div id="ga-lab-trip" class="ga-chip ga-neon clip" data-start="6.8" data-duration="1.4" style="left: 70px; top: 450px; --c: #38d6ff;">SON VOYAGE</div>
  </div>
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/beads.js"></script>
  <script src="assets/abs.js"></script>
  <script src="assets/grid.js"></script>
  <script>

    (function () {
      var HF = window.HF, lerp = HF.lerp, ease = HF.ease, easeOut = HF.easeOut, seg = HF.seg, $ = HF.el;
      var T0 = 0, T1 = 8.3;
      function w(t, a, b) { return ease(seg(t, a, a + 0.25)) * (1 - ease(seg(t, b - 0.25, b))); }

      var renderer = HF.makeRenderer($("ga-canvas"));
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070b16);
      scene.fog = new THREE.Fog(0x070b16, 12, 34);
      var camera = new THREE.PerspectiveCamera(38, HF.W / HF.H, 0.1, 80);
      scene.add(new THREE.HemisphereLight(0x6f8cff, 0x120c08, 0.6));
      var key = new THREE.DirectionalLight(0xffe2c0, 1.0); key.position.set(3, 5, 3); scene.add(key);
      var rim = new THREE.DirectionalLight(0x5aa0ff, 0.9); rim.position.set(-3, 3, -4); scene.add(rim);

      var fl = new THREE.PointLight(0xffffff, 0.35, 60); fl.position.set(0, 6, 8); scene.add(fl);

      var world = new THREE.Group(); scene.add(world);
      var ground = new THREE.Mesh(new THREE.BoxGeometry(34, 0.2, 7), HF.std(0x0b1a16, { roughness: 1 })); ground.position.set(0, -0.1, 0); world.add(ground);
      var plant = HF.makePlant(); plant.group.position.set(-9.5, 0, 0); world.add(plant.group);
      [-6.2, -3.9, -1.6, 0.7, 3.0].forEach(function (x) { var py = HF.makePylon(2.6); py.position.set(x, 0, 0); world.add(py); });
      var sub = HF.makeSubstation(); sub.position.set(5.8, 0, 0.2); world.add(sub);
      var pole = HF.makePole(); pole.position.set(8.0, 0, 0.2); world.add(pole);
      var house = HF.makeHouse(); house.group.position.set(10.0, 0, 0); world.add(house.group);
      var WP = [[-8.4, 1.0, 0], [-6.2, 2.4, 0], [-3.9, 2.4, 0], [-1.6, 2.4, 0], [0.7, 2.4, 0], [3.0, 2.4, 0], [5.0, 1.2, 0.1], [5.8, 0.95, 0.2], [7.2, 1.2, 0.2], [8.0, 1.78, 0.2], [9.4, 0.9, 0.1], [10.2, 0.3, 0.3]];
      var wp = [];
      for (var wi = 0; wi < WP.length; wi++) {
        wp.push(new THREE.Vector3(WP[wi][0], WP[wi][1], WP[wi][2]));
        if (wi < 5 && wi > 0) wp.push(new THREE.Vector3((WP[wi][0] + WP[wi + 1][0]) / 2, 2.15, 0));
      }
      var wcurve = new THREE.CatmullRomCurve3(wp);
      var wmat = new THREE.MeshStandardMaterial({ color: 0xcfd6e6, emissive: 0xffc41a, emissiveIntensity: 0.4, roughness: 0.4 });
      world.add(new THREE.Mesh(new THREE.TubeGeometry(wcurve, 300, 0.022, 6), wmat));
      var wpts = wcurve.getPoints(300), u1 = 0, u2 = 0;
      wpts.forEach(function (v, i) { if (!u1 && v.x >= 5.0) u1 = i / 300; if (!u2 && v.x >= 8.0) u2 = i / 300; });
      var hvB = HF.makeBeads(70, 0xffc41a, 0.16), mvB = HF.makeBeads(18, 0x38d6ff, 0.16), lvB = HF.makeBeads(12, 0x7dff9a, 0.16);
      world.add(hvB); world.add(mvB); world.add(lvB);
      function flow(t, vis, speed) {
        HF.setBeadsOn(hvB, wpts, t, speed, 0, 0, u1); HF.setBeadsOn(mvB, wpts, t, speed, 0.3, u1, u2); HF.setBeadsOn(lvB, wpts, t, speed, 0.6, u2, 1);
        hvB.material.opacity = 0.95 * vis; mvB.material.opacity = 0.95 * vis; lvB.material.opacity = 0.95 * vis;
      }

      var keys = [{ t: 0, p: [10.2, 1.5, 5.4], l: [10.2, 0.8, 0] }, { t: 5.0, p: [6.0, 2.4, 13], l: [6.0, 1.2, 0] }, { t: 8.3, p: [-8.0, 2.4, 12], l: [-8.0, 1.2, 0] }];
      function renderAt(t) {
        if (t > T1 + 0.05) return;
        flow(t, ease(seg(t, 1.2, 2.0)), 0.3);
        house.glow.material.opacity = 0.9 * ease(seg(t, 0.8, 1.4)); house.wmat.color.setHex(t > 0.8 ? 0xffd27a : 0x4a3a2a);
        HF.updateParticles(plant.steam, t, 0.7, 1.4, 1.6);
        HF.camKeys(camera, keys, t, 0.05);
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", function (e) { renderAt(e.detail.time); });
      renderAt(T0);
      var tl = gsap.timeline({ paused: true });
      var popd = function (sel, at, dd) { tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: dd || 0.25, ease: "back.out(2)" }, at); };
      ["#ga-lab-plug|0.5", "#ga-lab-far|4.6", "#ga-lab-trip|6.8"].forEach(function (q) { var a = q.split("|"); popd(a[0], parseFloat(a[1])); });
      window.__timelines["stageA"] = tl;
    })();

  </script>
