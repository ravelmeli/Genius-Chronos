<template>
  <style>

    #s4-chart .k2 { position: absolute; right: 40px; top: 322px; font-family: "Space Mono", monospace; font-size: 28px; color: #4aa8ff; }

  </style>

      <g id="s4-ld-prot" opacity="0"><line x1="0" y1="0" x2="0" y2="0" stroke="#4aa8ff" stroke-width="3"></line><circle r="8" fill="#4aa8ff"></circle></g>
    </svg>
    <div id="s4-tag-a" class="s4-mono clip" data-start="0.10" data-duration="6.3" style="left: 60px; top: 200px"><span class="s4-dot"></span>LA CARTE DE CHALEUR</div>
    <div id="s4-tag-b" class="s4-mono clip" data-start="6.60" data-duration="5.8" style="left: 60px; top: 200px"><span class="s4-dot"></span>LE VIEILLISSEMENT</div>
    <div id="s4-tag-c" class="s4-mono clip" data-start="12.60" data-duration="3.8" style="left: 60px; top: 200px"><span class="s4-dot"></span>LA PROTECTION</div>

    <div id="s4-lg-cold" class="s4-lg clip" data-start="0.70" data-duration="5.8" style="left: 765px; top: 722px">25 °C</div>

    <div id="s4-lab-heat" class="s4-chip clip" data-start="8.00" data-duration="4.4" style="background: #ff8a2a; color: #1a0c00; left: 80px; top: 330px">CHALEUR</div>
    <div id="s4-lab-old" class="s4-chip s4-neon clip" data-start="9.50" data-duration="2.9" style="--c: #9aa6c4; left: 600px; top: 340px">COUCHE USÉE</div>
    <div id="s4-cap" class="s4-card clip" data-start="9.00" data-duration="3.5">
      <div id="s4-pct" class="big">100 %</div>
      <div class="lab">CAPACITÉ DE LA BATTERIE</div>
      <div class="bar"><div id="s4-capfill"></div></div>
      <div id="s4-loss" class="loss">−20 %</div>
    </div>
    <div id="s4-chart" class="s4-card clip" data-start="12.70" data-duration="3.5">
      <svg viewBox="0 0 828 270">
        <line x1="0" y1="260" x2="828" y2="260" stroke="rgba(255,255,255,0.25)" stroke-width="3"></line>
        <line id="s4-thr" x1="470" y1="20" x2="470" y2="260" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-dasharray="8 10"></line>
        <path id="s4-temp" d="M 0 240 C 150 232, 300 190, 470 120 S 700 60, 828 52" fill="none" stroke="#ff8a2a" stroke-width="9" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"></path>
        <path id="s4-speed" d="M 0 60 L 470 60 C 560 62, 640 150, 720 214 S 800 232, 828 234" fill="none" stroke="#4aa8ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"></path>
        <text id="s4-thrt" x="482" y="48" fill="#fff" font-family="Space Mono, monospace" font-size="28">SEUIL</text>
      </svg>
      <div class="k1">TEMPÉRATURE</div>
      <div class="k2">VITESSE DE CHARGE</div>
    </div>
    <div id="s4-prot" class="s4-chip s4-neon clip" data-start="15.20" data-duration="1.3" style="--c: #4aa8ff">PROTECTION</div>
    <div id="s4-end" class="clip" data-start="16.70" data-duration="3.0"><span id="s4-end1">Pas un défaut.</span><span id="s4-end2" class="o">C'est de la physique.</span></div>
  </div>
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/common.js"></script>
  <script>

    (function () {
      var HF = window.HF, lerp = HF.lerp, ease = HF.ease, easeOut = HF.easeOut, seg = HF.seg, $ = HF.el;
      var T0 = 65.2, T1 = 84.9;
      var renderer = HF.makeRenderer($("s4-canvas"));
      var S = HF.makeScene(0x070b16);
      var scene = S.scene, camera = S.camera, heatLight = S.heatLight;
      var rnd = HF.mulberry32(404);
      var camTarget = new THREE.Vector3();

      // ---------- T1 : thermal map of the phone back ----------
      function thermalTexture() {
        var c = document.createElement("canvas");
        c.width = 304; c.height = 640;
        var g = c.getContext("2d");
        g.fillStyle = "#141a5c"; g.fillRect(0, 0, 304, 640);
        var bg = g.createLinearGradient(0, 0, 0, 640);
        bg.addColorStop(0, "rgba(106,27,154,0.55)"); bg.addColorStop(1, "rgba(20,26,92,0.0)");
        g.fillStyle = bg; g.fillRect(0, 0, 304, 640);
        function blob(x, y, r, stops) {
          var gr = g.createRadialGradient(x, y, 0, x, y, r);
          for (var i = 0; i < stops.length; i++) gr.addColorStop(stops[i][0], stops[i][1]);
          g.fillStyle = gr; g.fillRect(0, 0, 304, 640);
        }
        blob(152, 250, 200, [[0, "rgba(255,246,176,1)"], [0.22, "rgba(255,176,46,1)"], [0.5, "rgba(255,74,26,0.95)"], [0.8, "rgba(163,26,110,0.55)"], [1, "rgba(163,26,110,0)"]]);
        blob(152, 505, 120, [[0, "rgba(255,226,110,1)"], [0.3, "rgba(255,120,30,0.95)"], [0.7, "rgba(255,74,26,0.35)"], [1, "rgba(255,74,26,0)"]]);
        blob(78, 82, 60, [[0, "rgba(20,26,92,0.9)"], [1, "rgba(20,26,92,0)"]]);
        var t = new THREE.CanvasTexture(c);
        t.encoding = THREE.sRGBEncoding;
        return t;
      }
      var gT = new THREE.Group();
      scene.add(gT);
      var backMat = new THREE.MeshStandardMaterial({ color: 0x1d2230, metalness: 0.6, roughness: 0.4 });
      var back = new THREE.Mesh(HF.roundedBox(0.8, 1.64, 0.07, 0.12, 0.02), backMat);
      gT.add(back);
      var thermMat = new THREE.MeshBasicMaterial({ map: thermalTexture(), transparent: true, opacity: 0, toneMapped: false });
      var therm = new THREE.Mesh(HF.fixUV(new THREE.ShapeGeometry(HF.roundedShape(0.76, 1.6, 0.1), 8), 0.76, 1.6), thermMat);
      therm.position.z = 0.06;
      gT.add(therm);
      var glowT = HF.makeGlow(0xff7a1a, 3.2);
      glowT.position.set(0, 0, 0.2);
      gT.add(glowT);

      // ---------- T2 : aging shelf ----------
      var gA = new THREE.Group();
      scene.add(gA);
      var NS = 7, GAP = 0.3;
      var slabMat = new THREE.MeshStandardMaterial({ color: 0x59627a, metalness: 0.35, roughness: 0.5, emissive: 0xff5a00, emissiveIntensity: 0.5 });
      var seiMat = new THREE.MeshStandardMaterial({ color: 0x7a6a58, roughness: 0.85 });
      var slabs = [], seis = [];
      for (var i = 0; i < NS; i++) {
        var sl = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.5, 0.9), slabMat);
        sl.position.set((i - 3) * GAP, -0.25, 0);
        gA.add(sl); slabs.push(sl);
        var sa = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.9), seiMat);
        var sb = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.9), seiMat);
        gA.add(sa); gA.add(sb);
        seis.push([sa, sb]);
      }
      var base = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.1, 1.05), new THREE.MeshStandardMaterial({ color: 0x2b3350, metalness: 0.4, roughness: 0.6 }));
      base.position.set(0, -1.05, 0);
      gA.add(base);
      var ionMat = new THREE.MeshStandardMaterial({ color: 0x4aa8ff, emissive: 0x2a78d8, emissiveIntensity: 0.9, roughness: 0.3 });
      var ions = [];
      for (var k = 0; k < 60; k++) {
        var im = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), ionMat);
        im.userData = { gx: (k % 6 - 2.5) * GAP, y: -0.9 + Math.floor(k / 6) * 0.14, z: ((k * 7) % 3 - 1) * 0.26, ph: rnd() * 6.28 };
        gA.add(im); ions.push(im);
      }
      var glowA = HF.makeGlow(0xff7a1a, 5);
      glowA.position.set(0, 0.2, 0.6);
      gA.add(glowA);
      var partsA = HF.makeParticles(120, 12, 0.12);
      partsA.position.set(0, 0.5, 0);
      gA.add(partsA);

      // ---------- T3 : phone on a pedestal, protected ----------
      var gP = new THREE.Group();
      scene.add(gP);
      var ped = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.25, 0.18, 64), new THREE.MeshStandardMaterial({ color: 0x121a2e, metalness: 0.5, roughness: 0.45 }));
      ped.position.y = -0.09;
      gP.add(ped);
      var pedRim = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.018, 8, 96), new THREE.MeshBasicMaterial({ color: 0x5aa0ff, toneMapped: false }));
      pedRim.rotation.x = Math.PI / 2;
      gP.add(pedRim);
      var ph = HF.makePhone();
      ph.group.position.y = 0.88;
      gP.add(ph.group);
      var shield = new THREE.Mesh(new THREE.SphereGeometry(1.45, 32, 24), new THREE.MeshBasicMaterial({ color: 0x4aa8ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
      shield.position.y = 0.9;
      gP.add(shield);
      var shieldW = new THREE.Mesh(new THREE.SphereGeometry(1.47, 20, 14), new THREE.MeshBasicMaterial({ color: 0x9fd2ff, wireframe: true, transparent: true, opacity: 0, toneMapped: false }));
      shieldW.position.y = 0.9;
      gP.add(shieldW);
      var glowP = HF.makeGlow(0xff7a1a, 3.2);
      glowP.position.set(0, 0.9, 0.5);
      gP.add(glowP);

      var labBat = $("s4-lab-bat"), labCirc = $("s4-lab-circ"), labSame = $("s4-lab-same"), labProt = $("s4-prot");
      var allLd = ["s4-ld-bat", "s4-ld-circ", "s4-ld-same", "s4-ld-prot"];
      function hideLeaders() { for (var q = 0; q < allLd.length; q++) $(allLd[q]).setAttribute("opacity", "0"); }
      var tmp = new THREE.Vector3();

      function renderAt(t) {
        if (t < T0 - 0.05 || t > T1 + 0.05) return;
        var inT = t < 71.75, inA = t >= 71.75 && t < 77.75, inP = t >= 77.75;
        gT.visible = inT; gA.visible = inA; gP.visible = inP;
        heatLight.intensity = 0;
        hideLeaders();

        if (inT) {
          gT.scale.setScalar(0.94 + 0.06 * easeOut(seg(t, T0, T0 + 0.45)));
          gT.rotation.y = 0.28 * Math.sin((t - T0) * 0.8);
          thermMat.opacity = ease(seg(t, 65.6, 66.8));
          glowT.material.opacity = 0.25 * ease(seg(t, 65.8, 67));
          var k1 = ease(seg(t, T0, 71.75));
          camera.position.set(0, 0.1, lerp(5.6, 4.6, k1));
          camTarget.set(0, 0.0, 0);
          camera.lookAt(camTarget);
          camera.updateMatrixWorld();
          var a1 = new THREE.Vector3(-0.1, 0.25, 0.08), a2 = new THREE.Vector3(0.05, -0.55, 0.08), a3 = new THREE.Vector3(0.0, -0.15, 0.08);
          gT.localToWorld(a1); gT.localToWorld(a2); gT.localToWorld(a3);
          var p1 = HF.project(camera, a1), p2 = HF.project(camera, a2), p3 = HF.project(camera, a3);
          HF.place(labBat, p1.x - 140, p1.y - 20, true);
          HF.leader(camera, "s4-ld-bat", labBat, a1, 66.2, 71.6, t);
          HF.place(labCirc, p2.x + 120, p2.y + 20, false);
          HF.leader(camera, "s4-ld-circ", labCirc, a2, 67.0, 71.6, t);
          HF.leader(camera, "s4-ld-same", labSame, a3, 69.4, 71.6, t);
        }

        if (inA) {
          gA.scale.setScalar(0.62 * (0.94 + 0.06 * easeOut(seg(t, 71.75, 72.2))));
          var grow = ease(seg(t, 73.4, 76.6));
          for (var s = 0; s < NS; s++) {
            var x = (s - 3) * GAP, w = 0.002 + 0.075 * grow;
            seis[s][0].scale.set(w, 1, 1); seis[s][0].position.set(x - 0.05 - w / 2, -0.25, 0);
            seis[s][1].scale.set(w, 1, 1); seis[s][1].position.set(x + 0.05 + w / 2, -0.25, 0);
          }
          seiMat.color.setRGB(lerp(0.3, 0.52, grow), lerp(0.3, 0.42, grow), lerp(0.36, 0.35, grow));
          for (var q = 0; q < ions.length; q++) {
            var u = ions[q].userData;
            ions[q].position.set(u.gx + 0.01 * Math.sin(t * 19 + u.ph), u.y + 0.01 * Math.sin(t * 23 + u.ph), u.z);
          }
          glowA.material.opacity = 0.45;
          heatLight.position.set(0, 0.2, 1.8);
          heatLight.intensity = 1.2;
          HF.updateParticles(partsA, t, 0.8, 1.6, 1.4);
          camera.position.set(Math.sin(t * 0.4) * 0.3, -1.25, 8.2);
          camTarget.set(0, -1.25, 0);
          camera.lookAt(camTarget);
          camera.updateMatrixWorld();
        }

        if (inP) {
          gP.scale.setScalar(0.62 * (0.94 + 0.06 * easeOut(seg(t, 77.75, 78.2))));
          gP.position.y = 0;
          var hot = 0.85 * (1 - ease(seg(t, 79.4, 81.6)));
          ph.bodyMat.emissiveIntensity = hot * 0.5;
          ph.tintMat.opacity = hot * 0.25;
          glowP.material.opacity = hot * 0.4;
          var sh = ease(seg(t, 80.35, 81.0));
          shield.scale.setScalar(0.6 + 0.4 * sh);
          shield.material.opacity = 0.14 * sh * (1 - 0.35 * ease(seg(t, 82.2, 83.4)));
          shieldW.scale.setScalar(0.6 + 0.4 * sh);
          shieldW.material.opacity = 0.35 * sh * (1 - 0.6 * ease(seg(t, 82.2, 83.4)));
          ph.group.rotation.y = Math.sin((t - 77.75) * 0.8) * 0.4;
          heatLight.position.set(0, 1.0, 1.6);
          heatLight.intensity = hot * 1.2;
          camera.position.set(Math.sin(t * 0.3) * 0.3, -0.98, 8.2);
          camTarget.set(0, -0.98, 0);
          camera.lookAt(camTarget);
          camera.updateMatrixWorld();
          var sp = new THREE.Vector3(0.9, 1.5, 0);
          gP.localToWorld(sp);
          var ps = HF.project(camera, sp);
          HF.place(labProt, ps.x + 60, ps.y - 40, false);
          HF.leader(camera, "s4-ld-prot", labProt, sp, 80.4, 81.7, t);
        }
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", function (e) { renderAt(e.detail.time); });
      renderAt(T0);

      var tl = gsap.timeline({ paused: true });
      var pop = function (sel, at) { tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, at); };
      tl.fromTo("#s4-legend", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.70);
      pop("#s4-lab-bat", 1.00);
      pop("#s4-lab-circ", 1.80);
      pop("#s4-lab-same", 4.20);
      pop("#s4-lab-heat", 8.00);
      pop("#s4-lab-old", 9.50);
      tl.fromTo("#s4-cap", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 9.00);
      var pc = { v: 100 };
      tl.to(pc, { v: 80, duration: 2.4, ease: "power2.inOut", onUpdate: function () { var n = $("s4-pct"); if (n) n.textContent = Math.round(pc.v) + " %"; } }, 9.30);
      tl.fromTo("#s4-capfill", { scaleX: 1 }, { scaleX: 0.8, duration: 2.4, ease: "power2.inOut" }, 9.30);
      tl.fromTo("#s4-loss", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 11.40);
      tl.fromTo("#s4-chart", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 12.70);
      tl.fromTo("#s4-temp", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 2.2, ease: "none" }, 12.80);
      tl.fromTo("#s4-speed", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 2.2, ease: "none" }, 12.80);
      pop("#s4-prot", 15.20);
      tl.fromTo("#s4-end1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 16.75);
      tl.fromTo("#s4-end2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 18.20);
      window.__timelines["stage4"] = tl;
    })();

  </script>
</template>
