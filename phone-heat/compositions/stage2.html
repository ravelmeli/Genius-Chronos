<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #070b16;
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }
    #s2-canvas,
    #s2-leaders {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
    #s2-leaders {
      pointer-events: none;
    }
    .s2-chip {
      position: absolute;
      padding: 14px 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.96);
      color: #0a0f1c;
      font-weight: 700;
      font-size: 34px;
      white-space: nowrap;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
    .s2-neon {
      background: rgba(10, 16, 32, 0.92);
      color: #fff;
      border: 3px solid var(--c);
      box-shadow: 0 0 30px var(--c);
    }
    .s2-mono {
      position: absolute;
      font-family: "Space Mono", monospace;
      font-size: 28px;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.82);
      white-space: nowrap;
    }
    .s2-dot {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ff8a2a;
      margin-right: 14px;
    }
    .s2-card {
      position: absolute;
      left: 90px;
      width: 900px;
      background: rgba(10, 16, 32, 0.86);
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      color: #fff;
    }
    .s2-row {
      position: absolute;
      left: 36px;
      font-family: "Space Mono", monospace;
      font-size: 28px;
      letter-spacing: 0.1em;
    }
    .s2-bar {
      position: absolute;
      left: 36px;
      width: 828px;
      height: 26px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .s2-fill {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border-radius: 13px;
      transform-origin: left center;
    }
    #s2-gauge {
      top: 790px;
      height: 250px;
    }
    #s2-formula {
      top: 790px;
      height: 250px;
    }
    #s2-formula .eq {
      position: absolute;
      left: 0;
      width: 100%;
      top: 62px;
      text-align: center;
      font-size: 84px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    #s2-formula .eq i {
      font-style: normal;
      color: #ff8a2a;
    }
    #s2-formula .sub {
      position: absolute;
      left: 0;
      width: 100%;
      top: 176px;
      text-align: center;
      font-family: "Space Mono", monospace;
      font-size: 28px;
      color: rgba(255, 255, 255, 0.7);
    }
    #s2-bars {
      top: 740px;
      height: 400px;
    }
    .s2-col {
      position: absolute;
      bottom: 86px;
      width: 300px;
      border-radius: 14px 14px 0 0;
      transform-origin: bottom center;
    }
    .s2-collab {
      position: absolute;
      bottom: 22px;
      width: 420px;
      text-align: center;
      font-family: "Space Mono", monospace;
      font-size: 28px;
      color: #fff;
    }
  </style>
  <div id="root" data-composition-id="stage2" data-width="1080" data-height="1920">
    <canvas id="s2-canvas" width="1080" height="1920"></canvas>
    <svg id="s2-leaders" viewBox="0 0 1080 1920">
      <g id="s2-ld-cable" opacity="0"><line x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="3"></line><circle r="8" fill="#fff"></circle></g>
      <g id="s2-ld-core" opacity="0"><line x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="3"></line><circle r="8" fill="#fff"></circle></g>
      <g id="s2-ld-elec" opacity="0"><line x1="0" y1="0" x2="0" y2="0" stroke="#ffc41a" stroke-width="3"></line><circle r="8" fill="#ffc41a"></circle></g>
      <g id="s2-ld-atom" opacity="0"><line x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="3"></line><circle r="8" fill="#fff"></circle></g>
    </svg>

    <div id="s2-tag-a" class="s2-mono clip" data-start="0.20" data-duration="12.5" style="left: 60px; top: 200px"><span class="s2-dot"></span>RÉSISTANCE</div>
    <div id="s2-tag-b" class="s2-mono clip" data-start="12.70" data-duration="4.86" style="left: 60px; top: 200px"><span class="s2-dot"></span>CHARGE RAPIDE</div>
    <div id="s2-illu" class="s2-mono clip" data-start="0.20" data-duration="17.36" style="right: 60px; top: 190px; padding: 6px 16px; border-radius: 999px; background: rgba(10, 16, 32, 0.6)">ILLUSTRATIF</div>

    <div id="s2-lab-cable" class="s2-chip clip" data-start="0.30" data-duration="1.6">CÂBLE</div>
    <div id="s2-lab-core" class="s2-chip clip" data-start="1.40" data-duration="0.7">FIL DE CUIVRE</div>
    <div id="s2-lab-elec" class="s2-chip s2-neon clip" data-start="2.40" data-duration="3.5" style="--c: #ffc41a">ÉLECTRONS</div>
    <div id="s2-lab-atom" class="s2-chip s2-neon clip" data-start="3.50" data-duration="2.4" style="--c: #9aa6c4">ATOMES</div>
    <div id="s2-chip-heat" class="s2-chip clip" data-start="5.00" data-duration="0.9" style="left: 640px; top: 1010px; background: #ff8a2a; color: #1a0c00">VIBRENT : CHALEUR</div>

    <div id="s2-gauge" class="s2-card clip" data-start="6.00" data-duration="2.2">
      <div class="s2-row" style="top: 26px; color: #ffc41a">COURANT</div>
      <div class="s2-bar" style="top: 76px"><div id="s2-g-cur" class="s2-fill" style="background: #ffc41a"></div></div>
      <div class="s2-row" style="top: 128px; color: #ff8a2a">CHALEUR</div>
      <div class="s2-bar" style="top: 178px"><div id="s2-g-heat" class="s2-fill" style="background: #ff8a2a"></div></div>
    </div>
    <div id="s2-formula" class="s2-card clip" data-start="8.25" data-duration="1.6">
      <div class="eq">Chaleur = <i>I²</i> × R</div>
      <div class="sub">I = COURANT · R = RÉSISTANCE</div>
    </div>
    <div id="s2-bars" class="s2-card clip" data-start="9.90" data-duration="2.8">
      <div id="s2-col-1" class="s2-col" style="left: 80px; background: #ffc41a; height: 60px"></div>
      <div class="s2-collab" style="left: 30px">COURANT ×1 → CHALEUR ×1</div>
      <div id="s2-col-2" class="s2-col" style="left: 520px; background: #ff7a1a; height: 240px"></div>
      <div class="s2-collab" style="left: 470px">COURANT ×2 → CHALEUR ×4</div>
    </div>

    <div id="s2-lab-slow" class="s2-chip s2-neon clip" data-start="13.30" data-duration="4.2" style="--c: #4aa8ff; left: 70px; top: 340px">5 W · CHARGE LENTE</div>
    <div id="s2-lab-fast" class="s2-chip s2-neon clip" data-start="14.50" data-duration="3" style="--c: #ff7a1a; left: 600px; top: 340px">30 W · RAPIDE</div>
    <div id="s2-example" class="s2-mono clip" data-start="13.30" data-duration="4.2" style="left: 60px; top: 268px; letter-spacing: 0.06em; padding: 4px 14px; border-radius: 999px; background: rgba(10, 16, 32, 0.6)">VALEURS D'EXEMPLE</div>
  </div>
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/common.js"></script>
  <script>
    (function () {
      var HF = window.HF,
        clamp = HF.clamp,
        lerp = HF.lerp,
        ease = HF.ease,
        easeOut = HF.easeOut,
        seg = HF.seg;
      var T0 = 24.9,
        T1 = 42.46;
      var renderer = HF.makeRenderer(document.getElementById("s2-canvas"));
      var S = HF.makeScene(0x070b16);
      var scene = S.scene,
        camera = S.camera,
        heatLight = S.heatLight;
      var rnd = HF.mulberry32(77);

      var cableMat = new THREE.MeshStandardMaterial({ color: 0xe6e9f2, roughness: 0.45, metalness: 0.1, transparent: true, opacity: 1 });
      var copperMat = new THREE.MeshStandardMaterial({ color: 0xd98a4a, metalness: 0.85, roughness: 0.3, emissive: 0x4a1e00, emissiveIntensity: 0.4 });

      // ---------- R1 : dive into the cable ----------
      var gR1 = new THREE.Group();
      scene.add(gR1);
      var cable = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 12, 40, 1, true), cableMat);
      cableMat.side = THREE.DoubleSide;
      gR1.add(cable);
      var core = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 12, 24), copperMat);
      gR1.add(core);
      var strands = [];
      for (var si = 0; si < 6; si++) {
        var a = (si / 6) * Math.PI * 2;
        var st = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 12, 8), copperMat);
        st.position.set(Math.cos(a) * 0.1, 0, Math.sin(a) * 0.1);
        gR1.add(st);
      }

      // ---------- R2/R3 : atoms and electrons ----------
      var gL = new THREE.Group();
      scene.add(gL);
      var NX = 3,
        NY = 9,
        NZ = 3,
        SP = 0.5;
      var atomMat = new THREE.MeshStandardMaterial({ color: 0x8a93a8, roughness: 0.45, metalness: 0.3, emissive: 0xff5a00, emissiveIntensity: 0 });
      var atoms = [];
      for (var ix = 0; ix < NX; ix++)
        for (var iy = 0; iy < NY; iy++)
          for (var iz = 0; iz < NZ; iz++) {
            var am = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), atomMat);
            var base = new THREE.Vector3((ix - 1) * SP, (iy - 4) * SP, (iz - 1) * SP);
            am.userData = { base: base, ph: [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28] };
            am.position.copy(base);
            gL.add(am);
            atoms.push(am);
          }
      var elecMat = new THREE.MeshBasicMaterial({ color: 0xffc41a, toneMapped: false });
      var NE = 48;
      var elecs = [];
      for (var ei = 0; ei < NE; ei++) {
        var em = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10), elecMat);
        em.userData = { lx: (rnd() - 0.5) * 0.9, lz: (rnd() - 0.5) * 0.9, ph: rnd(), j: rnd() * 6.28 };
        gL.add(em);
        elecs.push(em);
      }
      var glowL = HF.makeGlow(0xff7a1a, 6);
      glowL.position.set(0, 0, -0.2);
      gL.add(glowL);

      // current-speed integral so electrons never jump when speed changes
      function trav(t) {
        var d = 0,
          dt = 0.05;
        for (var u = 27.0; u < t; u += dt) d += (1.1 + 1.2 * ease(seg(u, 31.0, 32.4))) * dt;
        return d;
      }

      // ---------- R4 : slow vs fast charging ----------
      var gF = new THREE.Group();
      scene.add(gF);
      var fastMat = new THREE.MeshStandardMaterial({ color: 0xe6e9f2, roughness: 0.45, emissive: 0xff5a00, emissiveIntensity: 0 });
      var slowCable = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 8, 24), new THREE.MeshStandardMaterial({ color: 0xe6e9f2, roughness: 0.45 }));
      slowCable.position.set(-0.55, 0, 0);
      gF.add(slowCable);
      var fastCable = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 8, 24), fastMat);
      fastCable.position.set(0.55, 0, 0);
      gF.add(fastCable);
      var dotMat = new THREE.MeshBasicMaterial({ color: 0xffc41a, toneMapped: false });
      var dotMatB = new THREE.MeshBasicMaterial({ color: 0x7ac4ff, toneMapped: false });
      var slowDots = [],
        fastDots = [];
      for (var k = 0; k < 6; k++) {
        var sd = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), dotMatB);
        gF.add(sd);
        slowDots.push(sd);
      }
      for (var k2 = 0; k2 < 30; k2++) {
        var fd = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), dotMat);
        gF.add(fd);
        fastDots.push(fd);
      }
      var glowF = HF.makeGlow(0xff7a1a, 3.4);
      glowF.position.set(0.55, 0, 0.2);
      gF.add(glowF);
      var partsF = HF.makeParticles(100, 5, 0.14);
      gF.add(partsF);

      var $ = HF.el;
      var labCable = $("s2-lab-cable"),
        labCore = $("s2-lab-core"),
        labElec = $("s2-lab-elec"),
        labAtom = $("s2-lab-atom");
      var camTarget = new THREE.Vector3();

      function renderAt(t) {
        if (t < T0 - 0.05 || t > T1 + 0.05) return;
        var inR1 = t < 27.0,
          inL = t >= 27.0 && t < 37.6,
          inF = t >= 37.6;
        gR1.visible = inR1;
        gL.visible = inL;
        gF.visible = inF;
        heatLight.intensity = 0;
        var off = ["s2-ld-cable", "s2-ld-core", "s2-ld-elec", "s2-ld-atom"];

        if (inR1) {
          var k1 = ease(seg(t, T0, 27.0));
          gR1.scale.setScalar(0.94 + 0.06 * easeOut(seg(t, T0, T0 + 0.45)));
          cableMat.opacity = 1 - 0.88 * ease(seg(t, 25.8, 26.7));
          copperMat.emissiveIntensity = 0.4 + 0.5 * ease(seg(t, 26.4, 27.0));
          camera.position.set(lerp(1.7, 0.45, k1), lerp(0.6, 0.15, k1), lerp(6.5, 1.6, k1));
          gR1.rotation.z = 0.25 * (1 - k1);
          camTarget.set(0, 0.1, 0);
          camera.lookAt(camTarget);
          camera.updateMatrixWorld();
          var pc = HF.project(camera, new THREE.Vector3(0.34, 0.9, 0));
          HF.place(labCable, pc.x + 40, pc.y - 140, false);
          HF.leader(camera, "s2-ld-cable", labCable, new THREE.Vector3(0.34, 0.9, 0), 25.2, 26.8, t);
          var pk = HF.project(camera, new THREE.Vector3(0.08, -0.5, 0.05));
          HF.place(labCore, pk.x - 40, pk.y + 120, true);
          HF.leader(camera, "s2-ld-core", labCore, new THREE.Vector3(0.08, -0.5, 0.05), 26.3, 27.0, t);
          HF.leader(camera, "s2-ld-elec", labElec, new THREE.Vector3(0, 0, 0), 0, 0.01, t);
          HF.leader(camera, "s2-ld-atom", labAtom, new THREE.Vector3(0, 0, 0), 0, 0.01, t);
        }

        if (inL) {
          var heat = ease(seg(t, 27.4, 30.6)) * 0.55 + ease(seg(t, 31.0, 36.8)) * 0.45;
          var cnt = Math.floor(lerp(22, NE, ease(seg(t, 31.0, 32.4))));
          var amp = 0.012 + 0.075 * heat;
          var tr = trav(t);
          atomMat.color.setRGB(lerp(0.54, 1.0, heat), lerp(0.58, 0.45, heat), lerp(0.66, 0.1, heat));
          atomMat.emissiveIntensity = heat * 0.7;
          for (var ai = 0; ai < atoms.length; ai++) {
            var a1 = atoms[ai],
              u = a1.userData;
            a1.position.set(u.base.x + amp * Math.sin(t * 21 + u.ph[0]), u.base.y + amp * Math.sin(t * 17 + u.ph[1]), u.base.z + amp * Math.sin(t * 19 + u.ph[2]));
          }
          for (var ei2 = 0; ei2 < NE; ei2++) {
            var e1 = elecs[ei2],
              d = e1.userData;
            e1.visible = ei2 < cnt;
            var y = ((d.ph * 4.4 + tr) % 4.4) - 2.2;
            e1.position.set(d.lx + 0.07 * Math.sin(y * 7 + d.j), y, d.lz + 0.07 * Math.sin(y * 5 + d.j * 1.3));
          }
          glowL.material.opacity = heat * 0.35;
          // R2 close, R3 pulls back to leave room for the cards
          var pb = ease(seg(t, 30.8, 32.0));
          var dist = lerp(6.4, 10.5, pb);
          gL.scale.setScalar(lerp(1, 0.55, pb) * (0.94 + 0.06 * easeOut(seg(t, 27.0, 27.45))));
          camera.position.set(lerp(1.6, 1.2, pb) + Math.sin(t * 0.7) * 0.05, lerp(0.5, -2.0, pb), dist);
          camTarget.set(0, lerp(0.0, -2.1, pb), 0);
          camera.lookAt(camTarget);
          camera.updateMatrixWorld();
          var pe = HF.project(camera, new THREE.Vector3(0.45, -0.6, 0.45));
          HF.place(labElec, pe.x + 70, pe.y + 30, false);
          HF.leader(camera, "s2-ld-elec", labElec, new THREE.Vector3(0.45, -0.6, 0.45), 27.3, 30.8, t);
          var pa = HF.project(camera, new THREE.Vector3(-0.5, 0.5, 0.5));
          HF.place(labAtom, pa.x - 60, pa.y - 40, true);
          HF.leader(camera, "s2-ld-atom", labAtom, new THREE.Vector3(-0.5, 0.5, 0.5), 28.4, 30.8, t);
          HF.leader(camera, "s2-ld-cable", labCable, new THREE.Vector3(0, 0, 0), 0, 0.01, t);
          HF.leader(camera, "s2-ld-core", labCore, new THREE.Vector3(0, 0, 0), 0, 0.01, t);
        }

        if (inF) {
          var pop = easeOut(seg(t, 37.6, 38.05));
          gF.scale.setScalar(0.94 + 0.06 * pop);
          var h2 = ease(seg(t, 39.2, 41.6));
          fastMat.emissiveIntensity = h2 * 0.8;
          fastMat.color.setRGB(1, lerp(0.9, 0.55, h2), lerp(0.95, 0.35, h2));
          for (var q = 0; q < slowDots.length; q++) {
            var yy = ((q / 6) * 7.6 + t * 0.55) % 7.6;
            slowDots[q].position.set(-0.55, yy - 3.8, 0.16);
          }
          for (var q2 = 0; q2 < fastDots.length; q2++) {
            var y2 = ((q2 / 30) * 7.6 + t * 2.2) % 7.6;
            fastDots[q2].position.set(0.55 + Math.sin(q2 * 1.7) * 0.03, y2 - 3.8, 0.16);
          }
          glowF.material.opacity = h2 * 0.55;
          heatLight.position.set(0.55, 0.2, 1.5);
          heatLight.intensity = h2 * 1.8;
          partsF.position.set(0.55, -1.2, 0.2);
          HF.updateParticles(partsF, t, h2, 3.4, 0.7);
          camera.position.set(Math.sin(t * 0.6) * 0.1, 0.1 + Math.sin(t * 0.9) * 0.05, 6.4);
          camTarget.set(0, 0.0, 0);
          camera.lookAt(camTarget);
          camera.updateMatrixWorld();
          for (var z = 0; z < off.length; z++) HF.el(off[z]).setAttribute("opacity", "0");
        }
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", function (e) {
        renderAt(e.detail.time);
      });
      renderAt(T0);

      // ---------- cards ----------
      var tl = gsap.timeline({ paused: true });
      var pop = function (sel, at, from) {
        tl.fromTo(sel, from || { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, at);
      };
      pop("#s2-lab-cable", 0.30);
      pop("#s2-lab-core", 1.40);
      pop("#s2-lab-elec", 2.40);
      pop("#s2-lab-atom", 3.50);
      pop("#s2-chip-heat", 5.00);
      tl.fromTo("#s2-gauge", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 6.00);
      tl.fromTo("#s2-g-cur", { scaleX: 0.35 }, { scaleX: 0.9, duration: 1.2, ease: "power2.inOut" }, 6.30);
      tl.fromTo("#s2-g-heat", { scaleX: 0.3 }, { scaleX: 0.95, duration: 1.4, ease: "power2.in" }, 6.50);
      tl.fromTo("#s2-formula", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 8.25);
      tl.fromTo("#s2-bars", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 9.90);
      tl.fromTo("#s2-col-1", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 10.40);
      tl.fromTo("#s2-col-2", { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power3.out" }, 11.10);
      pop("#s2-lab-slow", 13.30);
      pop("#s2-lab-fast", 14.50);
      window.__timelines["stage2"] = tl;
    })();
  </script>
</template>
