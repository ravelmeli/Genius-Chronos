<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0a0f1c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.2"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="stage"
        data-composition-id="stage"
        data-composition-src="compositions/stage.html"
        data-start="0"
        data-duration="20.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="20.2"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>
      <audio
        id="voice"
        class="clip"
        src="assets/voice.wav"
        data-start="0"
        data-duration="20.2"
        data-track-index="3"
        data-volume="1"
        data-fade-out="0.25"
      ></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="0.911" data-duration="4.6" data-track-index="4" data-volume="0.2" data-fade-out="0.4"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="4.310" data-duration="1.6" data-track-index="5" data-volume="0.22" data-fade-out="0.8"></audio>
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="6.071" data-duration="0.575" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-cut2" class="clip" src="assets/sfx/whoosh.mp3" data-start="12.621" data-duration="0.575" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-pop-temp" class="clip" src="assets/sfx/pop.mp3" data-start="3.393" data-duration="0.72" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-pop-pill1" class="clip" src="assets/sfx/pop.mp3" data-start="8.893" data-duration="0.72" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-pop-pill2" class="clip" src="assets/sfx/pop.mp3" data-start="9.193" data-duration="0.72" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-pop-pill3" class="clip" src="assets/sfx/pop.mp3" data-start="9.493" data-duration="0.72" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-ping-batt" class="clip" src="assets/sfx/ping.mp3" data-start="11.309" data-duration="1.32" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-pop-lab1" class="clip" src="assets/sfx/pop.mp3" data-start="13.593" data-duration="0.72" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-pop-lab2" class="clip" src="assets/sfx/pop.mp3" data-start="15.843" data-duration="0.72" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-pop-lab3" class="clip" src="assets/sfx/pop.mp3" data-start="17.543" data-duration="0.72" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-ping-heat" class="clip" src="assets/sfx/ping.mp3" data-start="18.489" data-duration="1.32" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-pop-loupe" class="clip" src="assets/sfx/pop.mp3" data-start="14.813" data-duration="0.72" data-track-index="5" data-volume="0.3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
