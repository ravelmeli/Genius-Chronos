  <script>
    (function () {
      var W = 1080,
        H = 1920;
      var DUR = 20.2;
      var clamp = function (x, a, b) {
        return Math.max(a, Math.min(b, x));
      };
      var lerp = function (a, b, t) {
        return a + (b - a) * t;
      };
      var ease = function (t) {
        t = clamp(t, 0, 1);
        return t * t * (3 - 2 * t);
      };
      var easeOut = function (t) {
        t = clamp(t, 0, 1);
        return 1 - Math.pow(1 - t, 3);
      };
      var seg = function (t, a, b) {
        return clamp((t - a) / (b - a), 0, 1);
      };
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      var canvas = document.getElementById("st-canvas");
      var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });

      scene.add(new THREE.HemisphereLight(0x6f8cff, 0x120c08, 0.28));

      var heatLight = new THREE.PointLight(0xff7a1a, 0, 5, 1.6);
      scene.add(heatLight);

      // ---------- shared pieces ----------
      function roundedShape(w, h, r) {
        var s = new THREE.Shape();
        var x = -w / 2,
          y = -h / 2;
        s.moveTo(x + r, y);
        s.lineTo(x + w - r, y);
        s.quadraticCurveTo(x + w, y, x + w, y + r);
        s.lineTo(x + w, y + h - r);
        s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        s.lineTo(x + r, y + h);
        s.quadraticCurveTo(x, y + h, x, y + h - r);
        s.lineTo(x, y + r);
        s.quadraticCurveTo(x, y, x + r, y);
        return s;
      }
      function roundedBox(w, h, d, r, bevel) {
        var g = new THREE.ExtrudeGeometry(roundedShape(w, h, r), {
          depth: d,
          bevelEnabled: true,
          bevelThickness: bevel,
          bevelSize: bevel,
          bevelSegments: 4,
          curveSegments: 10,
        });
        g.translate(0, 0, -d / 2);
        return g;
      }

      function fixUV(geo, w, h) {
        var pa = geo.attributes.position,
          uv = new Float32Array(pa.count * 2);
        for (var i = 0; i < pa.count; i++) {
          uv[i * 2] = pa.getX(i) / w + 0.5;
          uv[i * 2 + 1] = pa.getY(i) / h + 0.5;
        }
        geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
        return geo;
      }
      function screenTexture() {
        var c = document.createElement("canvas");
        c.width = 320;
        c.height = 640;
        var g = c.getContext("2d");
        var grad = g.createLinearGradient(0, 0, 0, 640);
        grad.addColorStop(0, "#14233f");
        grad.addColorStop(1, "#05070d");
        g.fillStyle = grad;
        g.fillRect(0, 0, 320, 640);
        g.fillStyle = "#ffffff";
        g.font = "700 96px sans-serif";
        g.textAlign = "center";
        g.fillText("23:47", 160, 230);
        g.font = "400 24px sans-serif";
        g.fillStyle = "rgba(255,255,255,0.7)";
        g.fillText("En charge", 160, 290);
        g.strokeStyle = "#7dff9a";
        g.lineWidth = 6;
        g.strokeRect(100, 540, 120, 50);
        g.fillStyle = "#7dff9a";
        g.fillRect(104, 544, 70, 42);
        var t = new THREE.CanvasTexture(c);
        t.encoding = THREE.sRGBEncoding;
        return t;
      }

      var phoneBodyMat = new THREE.MeshStandardMaterial({
        color: 0x1d2230,
        metalness: 0.6,
        roughness: 0.38,
        emissive: 0xff5a00,
        emissiveIntensity: 0,
      });
      var screenMat = new THREE.MeshBasicMaterial({ map: screenTexture(), toneMapped: false });
      var heatTint = new THREE.MeshBasicMaterial({
        color: 0xff7a1a,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      function makePhone() {
        var g = new THREE.Group();
        g.add(new THREE.Mesh(roundedBox(0.8, 1.64, 0.07, 0.12, 0.02), phoneBodyMat));
        var scr = new THREE.Mesh(fixUV(new THREE.ShapeGeometry(roundedShape(0.74, 1.58, 0.1), 8), 0.74, 1.58), screenMat);
        scr.position.z = 0.058;
        g.add(scr);
        var tint = new THREE.Mesh(new THREE.ShapeGeometry(roundedShape(0.74, 1.58, 0.1), 8), heatTint);
        tint.position.z = 0.062;
        g.add(tint);
        return g;
      }

      var spriteTex = (function () {
        var c = document.createElement("canvas");
        c.width = c.height = 64;
        var g = c.getContext("2d");
        var gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        gr.addColorStop(0, "rgba(255,255,255,1)");
        gr.addColorStop(0.4, "rgba(255,255,255,0.55)");
        gr.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = gr;
        g.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(c);
      })();
      // heat particles (seeded, looked up from t)
      function makeParticles(n, seed) {
        var rnd = mulberry32(seed);
        var geo = new THREE.BufferGeometry();
        var pos = new Float32Array(n * 3);
        var data = [];
        for (var i = 0; i < n; i++) {
          data.push({ ox: (rnd() - 0.5) * 0.5, oz: (rnd() - 0.5) * 0.4, ph: rnd(), sp: 0.28 + rnd() * 0.3, dr: (rnd() - 0.5) * 0.3 });
        }
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        var mat = new THREE.PointsMaterial({
          color: 0xff8a2a,
          map: spriteTex,
          size: 0.16,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        var pts = new THREE.Points(geo, mat);
        pts.frustumCulled = false;
        pts.userData = { data: data, n: n };
        return pts;
      }
      function updateParticles(pts, t, intensity, height) {
        var d = pts.userData.data;
        var arr = pts.geometry.attributes.position.array;
        for (var i = 0; i < pts.userData.n; i++) {
          var p = d[i];
          var u = (t * p.sp + p.ph) % 1;
          arr[i * 3] = p.ox + p.dr * u;
          arr[i * 3 + 1] = u * height;
          arr[i * 3 + 2] = p.oz;
        }
        pts.geometry.attributes.position.needsUpdate = true;
        pts.material.opacity = clamp(intensity, 0, 1) * 0.9;
      }

      var cableMat = new THREE.MeshStandardMaterial({ color: 0xdfe3ec, roughness: 0.5, metalness: 0.1 });
      var currentMat = new THREE.MeshBasicMaterial({ color: 0xffc41a, toneMapped: false });
      function makeCurrent(n) {
        var g = new THREE.Group();
        for (var i = 0; i < n; i++) {
          g.add(new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), currentMat));
        }
        return g;
      }
      function placeCurrent(group, curve, t, speed, alpha) {
        var n = group.children.length;
        for (var i = 0; i < n; i++) {
          var u = (t * speed + i / n) % 1;
          var p = curve.getPoint(u);
          var m = group.children[i];
          m.position.copy(p);
          m.visible = alpha > 0.01;
          m.scale.setScalar(0.6 + 0.6 * alpha);
        }
      }

      function makeGlow(color, scale) {
        var m = new THREE.SpriteMaterial({ map: spriteTex, color: color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, toneMapped: false });
        var sp = new THREE.Sprite(m);
        sp.scale.set(scale, scale, 1);
        return sp;
      }
      // ---------- scene A : phone on the table ----------
      var gA = new THREE.Group();
      scene.add(gA);
      var tableMat = new THREE.MeshStandardMaterial({ color: 0x120b09, roughness: 0.85, metalness: 0.05 });
      var table = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), tableMat);
      table.rotation.x = -Math.PI / 2;
      gA.add(table);
      var wallA = new THREE.Mesh(new THREE.PlaneGeometry(16, 8), new THREE.MeshStandardMaterial({ color: 0x0b1224, roughness: 1 }));
      wallA.position.set(0, 3, -3.4);
      gA.add(wallA);
      var lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.05, 6), new THREE.MeshStandardMaterial({ color: 0x2a2f44, flatShading: true }));
      lampBase.position.set(0.55, 0.03, -2.3);
      gA.add(lampBase);
      var lampPost = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.55, 6), new THREE.MeshStandardMaterial({ color: 0x2a2f44, flatShading: true }));
      lampPost.position.set(0.55, 0.3, -2.3);
      gA.add(lampPost);
      var lampShade = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.3, 6, 1, true), new THREE.MeshBasicMaterial({ color: 0xffc27a, side: THREE.DoubleSide, toneMapped: false }));
      lampShade.position.set(0.55, 0.7, -2.3);
      gA.add(lampShade);
      var lampGlow = makeGlow(0xffb060, 2.2);
      lampGlow.position.set(0.55, 0.62, -2.3);
      lampGlow.material.opacity = 0.55;
      gA.add(lampGlow);
      var lampLight = new THREE.PointLight(0xffb060, 1.1, 6, 1.5);
      lampLight.position.set(0.55, 0.6, -2.2);
      gA.add(lampLight);
      var glowA = makeGlow(0xff7a1a, 2.4);
      glowA.position.set(0.1, 0.25, 0);
      gA.add(glowA);
      var phoneA = makePhone();
      phoneA.rotation.x = -Math.PI / 2;
      phoneA.rotation.z = 0.35;
      phoneA.position.set(0.1, 0.05, 0);
      gA.add(phoneA);
      var curveA = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.05, 0.05, 0.85),
        new THREE.Vector3(-0.3, 0.05, 1.4),
        new THREE.Vector3(0.5, 0.05, 2.1),
        new THREE.Vector3(0.2, 0.9, 3.0),
      ]);
      gA.add(new THREE.Mesh(new THREE.TubeGeometry(curveA, 48, 0.035, 8, false), cableMat));
      var currentA = makeCurrent(8);
      gA.add(currentA);
      var ringA = new THREE.Mesh(
        new THREE.RingGeometry(0.95, 1.0, 64),
        new THREE.MeshBasicMaterial({ color: 0xff8a2a, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      ringA.rotation.x = -Math.PI / 2;
      ringA.position.set(0.1, 0.02, 0);
      gA.add(ringA);
      var partsA = makeParticles(120, 11);
      partsA.position.set(0.1, 0.1, 0);
      gA.add(partsA);

      // ---------- scene B : phone on a pedestal, three culprits ----------
      var gB = new THREE.Group();
      scene.add(gB);
      var ped = new THREE.Mesh(
        new THREE.CylinderGeometry(1.15, 1.25, 0.18, 64),
        new THREE.MeshStandardMaterial({ color: 0x121a2e, metalness: 0.5, roughness: 0.45 })
      );
      ped.position.y = -0.09;
      gB.add(ped);
      var pedRim = new THREE.Mesh(
        new THREE.TorusGeometry(1.15, 0.018, 8, 96),
        new THREE.MeshBasicMaterial({ color: 0x5aa0ff, toneMapped: false })
      );
      pedRim.rotation.x = Math.PI / 2;
      pedRim.position.y = 0.0;
      gB.add(pedRim);
      var phoneBWrap = new THREE.Group();
      var phoneB = makePhone();
      phoneB.position.y = 0.88;
      phoneBWrap.add(phoneB);
      gB.add(phoneBWrap);
      var battGlow = new THREE.Mesh(
        new THREE.ShapeGeometry(roundedShape(0.56, 0.9, 0.06), 8),
        new THREE.MeshBasicMaterial({ color: 0xff6a00, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      battGlow.position.set(0, 0.88, 0.07);
      phoneBWrap.add(battGlow);
      var orbs = [];
      for (var oi = 0; oi < 3; oi++) {
        var om = new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, toneMapped: false });
        var ob = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 24), om);
        gB.add(ob);
        var og = makeGlow(0xff7a1a, 0.8);
        ob.add(og);
        ob.userData.glow = og;
        orbs.push(ob);
      }

      // ---------- scene C : socket, charger, cable, phone ----------
      var gC = new THREE.Group();
      scene.add(gC);
      var floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), tableMat);
      floor.rotation.x = -Math.PI / 2;
      gC.add(floor);
      var wall = new THREE.Mesh(
        new THREE.PlaneGeometry(14, 10),
        new THREE.MeshStandardMaterial({ color: 0x0e1424, roughness: 0.95 })
      );
      wall.position.set(0, 5, -1.5);
      gC.add(wall);
      var plate = new THREE.Mesh(
        roundedBox(0.7, 0.7, 0.03, 0.08, 0.01),
        new THREE.MeshStandardMaterial({ color: 0xcfd3dc, roughness: 0.6 })
      );
      plate.position.set(0, 2.6, -1.47);
      gC.add(plate);
      var brickMat = new THREE.MeshStandardMaterial({ color: 0xc4c8d4, roughness: 0.5, emissive: 0xff5a00, emissiveIntensity: 0 });
      var brick = new THREE.Mesh(roundedBox(0.5, 0.55, 0.42, 0.07, 0.02), brickMat);
      brick.position.set(0, 2.6, -1.18);
      gC.add(brick);
      var curveC = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 2.6, -1.4),
        new THREE.Vector3(0, 2.55, -1.0),
        new THREE.Vector3(0, 2.2, -0.8),
        new THREE.Vector3(0.45, 1.2, -0.2),
        new THREE.Vector3(-0.2, 0.4, 0.4),
        new THREE.Vector3(0.1, 0.05, 0.75),
      ]);
      gC.add(new THREE.Mesh(new THREE.TubeGeometry(curveC, 80, 0.035, 8, false), cableMat));
      var currentC = makeCurrent(14);
      gC.add(currentC);
      var phoneC = makePhone();
      phoneC.rotation.x = -Math.PI / 2;
      phoneC.position.set(0.1, 0.05, 0.1);
      gC.add(phoneC);
      var glowC = makeGlow(0xff7a1a, 2.6);
      glowC.position.set(0, 2.6, -0.8);
      gC.add(glowC);
      var partsC = makeParticles(160, 23);
      partsC.position.set(0, 2.9, -1.1);
      gC.add(partsC);

      // ---------- DOM labels ----------
      var el = function (id) {
        return document.getElementById(id);
      };
      var tmp = new THREE.Vector3();
      function project(v3, dx, dy) {
        tmp.copy(v3).project(camera);
        return { x: (tmp.x * 0.5 + 0.5) * W + (dx || 0), y: (-tmp.y * 0.5 + 0.5) * H + (dy || 0) };
      }
      var labChargeur = el("st-lab-chargeur"),
        labPrise = el("st-lab-prise"),
        labTel = el("st-lab-tel"),
        labHeat = el("st-heat");
      function place(node, p, anchorRight) {
        var w = node.offsetWidth || 220;
        var x = anchorRight ? p.x - w : p.x;
        x = clamp(x, 60, W - 60 - w);
        node.style.left = x.toFixed(1) + "px";
        node.style.top = clamp(p.y, 270, 1110).toFixed(1) + "px";
      }

      function leader(id, node, anchor, t0, t1, t) {
        var a = project(anchor);
        var cx = node.offsetLeft + node.offsetWidth / 2,
          cy = node.offsetTop + node.offsetHeight / 2;
        setLeader(el(id), a.x, a.y, cx, cy, t0, t1, t);
      }
      function leaderTo(id, tx, ty, anchor, t0, t1, t) {
        var a = project(anchor);
        setLeader(el(id), a.x, a.y, tx, ty, t0, t1, t);
      }
      function setLeader(g, x, y, cx, cy, t0, t1, t) {
        var line = g.firstElementChild,
          dot = g.lastElementChild;
        line.setAttribute("x1", x.toFixed(1));
        line.setAttribute("y1", y.toFixed(1));
        line.setAttribute("x2", cx.toFixed(1));
        line.setAttribute("y2", cy.toFixed(1));
        dot.setAttribute("cx", x.toFixed(1));
        dot.setAttribute("cy", y.toFixed(1));
        g.setAttribute("opacity", (ease(seg(t, t0, t0 + 0.2)) * (1 - seg(t, t1 - 0.12, t1))).toFixed(2));
      }
      var allLeaders = ["ld-chargeur", "ld-prise", "ld-tel", "ld-heat", "ld-loupe"];
      // ---------- per-frame ----------
      var A_END = 6.2,
        B_END = 12.75;
      var camTarget = new THREE.Vector3();

      function renderAt(t) {
        var inA = t < A_END,
          inB = t >= A_END && t < B_END,
          inC = t >= B_END;
        if (!inC) for (var li = 0; li < allLeaders.length; li++) el(allLeaders[li]).setAttribute("opacity", "0");
        gA.visible = inA;
        gB.visible = inB;
        gC.visible = inC;
        heatLight.intensity = 0;
        phoneBodyMat.emissiveIntensity = 0;
        heatTint.opacity = 0;
        brickMat.emissiveIntensity = 0;

        if (inA) {
          var pop = easeOut(seg(t, 0, 0.45));
          gA.scale.setScalar(0.92 + 0.08 * pop);
          var heat = ease(seg(t, 2.6, 4.4));
          phoneBodyMat.emissiveIntensity = heat * 0.55;
          heatTint.opacity = heat * 0.22;
          heatLight.position.set(0.1, 0.5, 0.1);
          heatLight.intensity = heat * 2.2;
          placeCurrent(currentA, curveA, t, 0.55, 1 - seg(t, 1.7, 2.3));
          var rp = seg(t, 4.3, 5.6);
          ringA.scale.setScalar(0.7 + rp * 1.6);
          ringA.material.opacity = (1 - rp) * seg(t, 4.3, 4.45) * 0.9;
          updateParticles(partsA, t, heat, 1.3);
          glowA.material.opacity = heat * 0.4;
          var k = ease(seg(t, 0, A_END));
          camera.position.set(lerp(1.4, 0.5, k), lerp(3.7, 3.0, k), lerp(3.6, 2.6, k));
          camTarget.set(0.1, 0.0, 0.15);
          camera.lookAt(camTarget);
          camera.position.x += Math.sin(t * 0.8) * 0.02;
        }

        if (inB) {
          var lt = t - A_END;
          var popB = easeOut(seg(t, A_END, A_END + 0.45));
          gB.scale.setScalar(0.92 + 0.08 * popB);
          phoneBWrap.rotation.y = Math.sin(lt * 0.9) * 0.55;
          for (var i = 0; i < 3; i++) {
            var ang = lt * 0.9 + (i * Math.PI * 2) / 3;
            var rad = 1.45;
            orbs[i].position.set(Math.cos(ang) * rad, 0.75 + i * 0.28 + Math.sin(lt * 1.6 + i) * 0.06, Math.sin(ang) * rad);
            var on = 1;
            var s = 0.7;
            if (i === 2) {
              var hi = ease(seg(t, 11.5, 12.1));
              s = 0.7 + hi * 0.9;
            }
            var show = ease(seg(t, 8.9 + i * 0.3, 9.3 + i * 0.3));
            orbs[i].scale.setScalar(Math.max(0.001, s * show));
            orbs[i].material.opacity = 1;
            orbs[i].userData.glow.material.opacity = 0.5 * show;
          }
          var bg = ease(seg(t, 11.5, 12.2));
          battGlow.material.opacity = bg * 0.6;
          phoneBodyMat.emissiveIntensity = bg * 0.3;
          heatLight.position.set(0, 1.0, 1.0);
          heatLight.intensity = bg * 1.6;
          var kb = ease(seg(t, A_END, B_END));
          camera.position.set(Math.sin(lt * 0.25) * 0.6, lerp(1.9, 1.6, kb), lerp(6.4, 5.2, kb));
          camTarget.set(0, 0.85, 0);
          camera.position.y += Math.sin(lt * 1.1) * 0.02;
          camera.lookAt(camTarget);
        }

        if (inC) {
          var popC = easeOut(seg(t, B_END, B_END + 0.45));
          gC.scale.setScalar(0.94 + 0.06 * popC);
          var flow = seg(t, 14.5, 14.9) * (1 - seg(t, 18.4, 19.0) * 0.4);
          placeCurrent(currentC, curveC, t, 0.28, flow);
          var heatC = ease(seg(t, 18.4, 19.6));
          brickMat.emissiveIntensity = heatC * 0.35;
          heatLight.position.set(0, 2.6, -0.7);
          heatLight.intensity = heatC * 1.4;
          updateParticles(partsC, t, heatC, 1.1);
          glowC.material.opacity = heatC * 0.28;
          var c1 = ease(seg(t, 14.0, 16.6));
          var c2 = ease(seg(t, 17.2, 20.2));
          camera.position.set(lerp(lerp(0.6, 0.35, c1), 0.1, c2), lerp(lerp(2.9, 1.9, c1), 1.7, c2), lerp(lerp(3.2, 5.0, c1), 5.2, c2));
          camera.position.x += Math.sin(t * 0.9) * 0.025;
          camera.position.y += Math.sin(t * 1.3) * 0.02;
          camTarget.set(0, lerp(lerp(2.5, 1.5, c1), 1.5, c2), -0.3);
          camera.lookAt(camTarget);
          camera.updateMatrixWorld();
          camera.updateProjectionMatrix();
          place(labChargeur, project(new THREE.Vector3(0.3, 2.5, -1.18), 36, 20), false);
          place(labPrise, project(new THREE.Vector3(-0.38, 2.9, -1.47), -24, -60), true);
          place(labTel, project(new THREE.Vector3(-0.45, 0.05, 0.1), -30, -90), true);
          place(labHeat, project(new THREE.Vector3(0.3, 3.1, -1.0), 30, -30), false);
          leader("ld-chargeur", labChargeur, new THREE.Vector3(0.22, 2.5, -0.97), 13.8, 20.2, t);
          leader("ld-prise", labPrise, new THREE.Vector3(-0.28, 2.82, -1.46), 16.05, 20.2, t);
          leader("ld-tel", labTel, new THREE.Vector3(-0.3, 0.08, 0.1), 17.75, 20.2, t);
          leader("ld-heat", labHeat, new THREE.Vector3(0.15, 2.9, -1.0), 18.9, 20.2, t);
          leaderTo("ld-loupe", 540, 770, new THREE.Vector3(0.0, 2.45, -0.95), 14.95, 18.1, t);
        }

        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", function (e) {
        renderAt(e.detail.time);
      });
      renderAt(0);

      // temperature counter + pill highlight, driven by the timeline
      var tl = gsap.timeline({ paused: true });
      var counter = { v: 24 };
      tl.to(counter, {
        v: 43,
        duration: 1.0,
        ease: "power2.out",
        onUpdate: function () {
          var n = el("st-temp-val");
          if (n) n.textContent = Math.round(counter.v);
        },
      }, 3.5);
      tl.fromTo("#st-temp", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 3.4);
      tl.fromTo("#st-pill-1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 8.9);
      tl.fromTo("#st-pill-2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 9.2);
      tl.fromTo("#st-pill-3", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 9.5);
      tl.to("#st-pill-3", { backgroundColor: "#ff8a2a", color: "#1a0c00", duration: 0.25 }, 11.58);
      tl.fromTo("#st-lab-chargeur", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 13.6);
      tl.fromTo("#st-lab-prise", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 15.85);
      tl.fromTo("#st-lab-tel", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 17.55);
      tl.fromTo("#st-heat", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 18.7);
      tl.fromTo("#st-loupe", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 14.8);
      tl.fromTo("#lp-tag-ac", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 15.5);
      tl.fromTo("#lp-ac", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "none" }, 15.5);
      tl.fromTo("#lp-tag-dc", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 16.7);
      tl.fromTo("#lp-dc", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "none" }, 16.7);
      tl.to("#st-loupe", { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.in" }, 17.9);
      window.__timelines["stage"] = tl;
    })();
  </script>
</template>
