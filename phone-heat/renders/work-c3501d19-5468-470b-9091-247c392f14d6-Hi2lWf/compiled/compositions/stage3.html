<template>
  <style>
    #root { position: absolute; inset: 0; background: #070b16; font-family: "Inter", sans-serif; overflow: hidden; }
    #s3-canvas, #s3-leaders { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s3-leaders { pointer-events: none; }
    .s3-chip { position: absolute; padding: 14px 26px; border-radius: 999px; background: rgba(255,255,255,0.96); color: #0a0f1c; font-weight: 700; font-size: 34px; white-space: nowrap; box-shadow: 0 6px 24px rgba(0,0,0,0.35); }
    .s3-neon { background: rgba(10,16,32,0.92); color: #fff; border: 3px solid var(--c); box-shadow: 0 0 30px var(--c); }
    .s3-mono { position: absolute; font-family: "Space Mono", monospace; font-size: 28px; letter-spacing: 0.14em; color: rgba(255,255,255,0.82); white-space: nowrap; }
    .s3-dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #ff8a2a; margin-right: 14px; }
    .s3-card { position: absolute; left: 90px; width: 900px; background: rgba(10,16,32,0.86); border: 3px solid rgba(255,255,255,0.2); border-radius: 28px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); color: #fff; }
    .s3-row { position: absolute; left: 36px; font-family: "Space Mono", monospace; font-size: 28px; letter-spacing: 0.1em; }

    #s3-count { top: 760px; height: 420px; }
    #s3-count .big { position: absolute; left: 36px; top: 40px; font-size: 92px; font-weight: 800; letter-spacing: -0.01em; }
    #s3-count .lab { position: absolute; left: 36px; top: 150px; font-family: "Space Mono", monospace; font-size: 28px; letter-spacing: 0.08em; color: rgba(255,255,255,0.7); }
    #s3-count svg { position: absolute; left: 36px; top: 210px; width: 828px; height: 160px; }
    #s3-count .cl { position: absolute; left: 36px; top: 360px; font-family: "Space Mono", monospace; font-size: 28px; color: #ff8a2a; }
  </style>
  <div id="root" data-composition-id="stage3" data-width="1080" data-height="1920">
    <canvas id="s3-canvas" width="1080" height="1920"></canvas>
    <svg id="s3-leaders" viewBox="0 0 1080 1920">
      <g id="s3-ld-batt" opacity="0"><line x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="3"></line><circle r="8" fill="#fff"></circle></g>
      <g id="s3-ld-ion" opacity="0"><line x1="0" y1="0" x2="0" y2="0" stroke="#4aa8ff" stroke-width="3"></line><circle r="8" fill="#4aa8ff"></circle></g>
      <g id="s3-ld-gra" opacity="0"><line x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="3"></line><circle r="8" fill="#fff"></circle></g>
      <g id="s3-ld-ion2" opacity="0"><line x1="0" y1="0" x2="0" y2="0" stroke="#4aa8ff" stroke-width="3"></line><circle r="8" fill="#4aa8ff"></circle></g>
      <g id="s3-ld-res" opacity="0"><line x1="0" y1="0" x2="0" y2="0" stroke="#ff8a2a" stroke-width="3"></line><circle r="8" fill="#ff8a2a"></circle></g>
    </svg>
    <div id="s3-tag-a" class="s3-mono clip" data-start="0.14" data-duration="3.1" style="left: 60px; top: 200px"><span class="s3-dot"></span>DANS LA BATTERIE</div>
    <div id="s3-tag-b" class="s3-mono clip" data-start="3.34" data-duration="7.4" style="left: 60px; top: 200px"><span class="s3-dot"></span>LES IONS LITHIUM</div>
    <div id="s3-tag-c" class="s3-mono clip" data-start="10.84" data-duration="4.7" style="left: 60px; top: 200px"><span class="s3-dot"></span>RÉSISTANCE INTERNE</div>
    <div id="s3-tag-d" class="s3-mono clip" data-start="15.54" data-duration="7.2" style="left: 60px; top: 200px"><span class="s3-dot"></span>LA CHALEUR S'ADDITIONNE</div>
    <div id="s3-illu" class="s3-mono clip" data-start="0.14" data-duration="22.6" style="right: 60px; top: 190px; padding: 6px 16px; border-radius: 999px; background: rgba(10,16,32,0.6)">ILLUSTRATIF</div>
    <div id="s3-lab-batt" class="s3-chip clip" data-start="1.54" data-duration="1.7">BATTERIE</div>
    <div id="s3-lab-ion" class="s3-chip s3-neon clip" data-start="4.14" data-duration="6.6" style="--c: #4aa8ff">IONS LITHIUM</div>
    <div id="s3-lab-gra" class="s3-chip s3-neon clip" data-start="5.74" data-duration="5" style="--c: #9aa6c4">GRAPHITE</div>
    <div id="s3-chip-full" class="s3-chip clip" data-start="9.74" data-duration="1" style="left: 600px; top: 1010px; background: #ff8a2a; color: #1a0c00">TROP PLEIN</div>
    <div id="s3-lab-ion2" class="s3-chip s3-neon clip" data-start="11.04" data-duration="4.5" style="--c: #4aa8ff">UN ION</div>
    <div id="s3-lab-res" class="s3-chip clip" data-start="12.14" data-duration="3.4" style="background: #ff8a2a; color: #1a0c00">FROTTEMENT = CHALEUR</div>
    <div id="s3-count" class="s3-card clip" data-start="15.94" data-duration="6.8">
      <div id="s3-num" class="big">1</div>
      <div class="lab">IONS EN MOUVEMENT (EXEMPLE)</div>
      <svg viewBox="0 0 828 160"><path id="s3-curve" d="M 0 150 C 200 148, 380 130, 520 90 S 760 20, 828 8" fill="none" stroke="#ff8a2a" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"></path></svg>
      <div class="cl">TEMPÉRATURE ↗</div>
    </div>
  </div>
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/common.js"></script>
  <script>

    (function () {
      var HF = window.HF, lerp = HF.lerp, ease = HF.ease, easeOut = HF.easeOut, seg = HF.seg, $ = HF.el;
      var T0 = 42.46, T1 = 65.2;
      var renderer = HF.makeRenderer($("s3-canvas"));
      var S = HF.makeScene(0x070b16);
      var scene = S.scene, camera = S.camera, heatLight = S.heatLight;
      var rnd = HF.mulberry32(303);
      var camTarget = new THREE.Vector3();

      // ---------- B1 : see-through phone, battery inside ----------
      var gB1 = new THREE.Group();
      scene.add(gB1);
      var ph = HF.makePhone();
      ph.bodyMat.transparent = true;
      ph.screenMat.transparent = true;
      gB1.add(ph.group);
      var battMat = new THREE.MeshStandardMaterial({ color: 0x1d4f9c, metalness: 0.4, roughness: 0.4, emissive: 0x123a7a, emissiveIntensity: 0.35 });
      var batt = new THREE.Mesh(HF.roundedBox(0.6, 0.98, 0.1, 0.06, 0.015), battMat);
      batt.position.set(0, 0.1, -0.02);
      gB1.add(batt);
      var battCap = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.08), new THREE.MeshStandardMaterial({ color: 0xcfd3dc, metalness: 0.7, roughness: 0.3 }));
      battCap.position.set(0, 0.64, -0.02);
      gB1.add(battCap);
      var glowB1 = HF.makeGlow(0x4aa8ff, 3.0);
      glowB1.position.set(0, 0.1, 0.1);
      gB1.add(glowB1);

      // ---------- B2 / B4 : the "bookshelf" cell ----------
      var gC = new THREE.Group();
      scene.add(gC);
      var NS = 7, GAP = 0.3;
      var slabMat = new THREE.MeshStandardMaterial({ color: 0x59627a, metalness: 0.35, roughness: 0.5, emissive: 0xff5a00, emissiveIntensity: 0 });
      var slabs = [];
      for (var i = 0; i < NS; i++) {
        var sl = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.5, 0.9), slabMat);
        sl.position.set((i - 3) * GAP, -0.25, 0);
        gC.add(sl);
        slabs.push(sl);
      }
      var base = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.1, 1.05), new THREE.MeshStandardMaterial({ color: 0x2b3350, metalness: 0.4, roughness: 0.6 }));
      base.position.set(0, -1.05, 0);
      gC.add(base);
      var cathode = new THREE.Mesh(HF.roundedBox(2.3, 0.3, 1.05, 0.06, 0.02), new THREE.MeshStandardMaterial({ color: 0x2a3b66, metalness: 0.4, roughness: 0.45 }));
      cathode.position.set(0, 1.85, 0);
      gC.add(cathode);
      var elyte = new THREE.Mesh(new THREE.BoxGeometry(2.3, 2.45, 1.05), new THREE.MeshBasicMaterial({ color: 0x4aa8ff, transparent: true, opacity: 0.07, depthWrite: false }));
      elyte.position.set(0, 0.55, 0);
      gC.add(elyte);
      var ionMat = new THREE.MeshStandardMaterial({ color: 0x4aa8ff, emissive: 0x2a78d8, emissiveIntensity: 0.9, roughness: 0.3 });
      var NI = 72;
      var ions = [];
      for (var k = 0; k < NI; k++) {
        var gapIdx = k % 6; // 6 gaps between 7 slabs
        var level = Math.floor(k / 6) % 12; // stacking height in gap
        var zlane = (Math.floor(k / 72 * 1) + (k % 2)) ? 0.22 : -0.22;
        var im = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 14), ionMat);
        var slot = new THREE.Vector3((gapIdx - 2.5) * GAP, -0.9 + level * 0.145, ((k * 7) % 3 - 1) * 0.26);
        var start = new THREE.Vector3(slot.x + (rnd() - 0.5) * 0.4, 1.65, (rnd() - 0.5) * 0.7);
        im.userData = { slot: slot, start: start, t0: 46.0 + (k / NI) * 5.2, ph: rnd() * 6.28, spark: HF.makeGlow(0xff8a2a, 0.55) };
        gC.add(im);
        gC.add(im.userData.spark);
        ions.push(im);
      }
      var glowC = HF.makeGlow(0xff7a1a, 5);
      glowC.position.set(0, 0.2, 0.6);
      gC.add(glowC);
      var partsC = HF.makeParticles(160, 91, 0.12);
      partsC.position.set(0, 0.5, 0);
      gC.add(partsC);

      // ---------- B3 : one ion squeezing through ----------
      var gH = new THREE.Group();
      scene.add(gH);
      var hMat = new THREE.MeshStandardMaterial({ color: 0x3a4258, metalness: 0.35, roughness: 0.5, emissive: 0xff5a00, emissiveIntensity: 0 });
      var hl = new THREE.Mesh(new THREE.BoxGeometry(0.7, 3.4, 0.9), hMat);
      hl.position.set(-0.43, 0, 0);
      gH.add(hl);
      var hr = new THREE.Mesh(new THREE.BoxGeometry(0.7, 3.4, 0.9), hMat);
      hr.position.set(0.43, 0, 0);
      gH.add(hr);
      var hero = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 24), ionMat);
      gH.add(hero);
      var heroGlow = HF.makeGlow(0xff7a1a, 1.5);
      gH.add(heroGlow);
      var partsH = HF.makeParticles(60, 17, 0.1);
      gH.add(partsH);

      var labBatt = $("s3-lab-batt"), labIon = $("s3-lab-ion"), labGra = $("s3-lab-gra"), labIon2 = $("s3-lab-ion2"), labRes = $("s3-lab-res");
      var allLd = ["s3-ld-batt", "s3-ld-ion", "s3-ld-gra", "s3-ld-ion2", "s3-ld-res"];
      function hideLeaders() { for (var q = 0; q < allLd.length; q++) $(allLd[q]).setAttribute("opacity", "0"); }

      function ionPos(im, t, out) {
        var u = im.userData;
        var f = seg(t, u.t0, u.t0 + 1.7);
        var e = HF.ease(f);
        out.set(lerp(u.start.x, u.slot.x, e) + Math.sin(f * 9 + u.ph) * 0.05 * (1 - f), lerp(u.start.y, u.slot.y, e), lerp(u.start.z, u.slot.z, e));
        return f;
      }
      var tmpV = new THREE.Vector3();

      function renderAt(t) {
        if (t < T0 - 0.05 || t > T1 + 0.05) return;
        var inB1 = t < 45.7, inB2 = t >= 45.7 && t < 53.2, inB3 = t >= 53.2 && t < 58.0, inB4 = t >= 58.0;
        gB1.visible = inB1;
        gC.visible = inB2 || inB4;
        gH.visible = inB3;
        heatLight.intensity = 0;
        hideLeaders();

        if (inB1) {
          var k = ease(seg(t, T0, 45.7));
          gB1.scale.setScalar(0.94 + 0.06 * easeOut(seg(t, T0, T0 + 0.45)));
          gB1.rotation.y = 0.5 * Math.sin((t - T0) * 0.9);
          var fade = ease(seg(t, 43.3, 44.4));
          ph.bodyMat.opacity = 1 - 0.88 * fade;
          ph.screenMat.opacity = 1 - fade;
          glowB1.material.opacity = 0.45 * fade;
          camera.position.set(lerp(0.6, 0.2, k), lerp(0.5, 0.15, k), lerp(5.4, 3.0, k));
          camTarget.set(0, 0.1, 0);
          camera.lookAt(camTarget);
          camera.updateMatrixWorld();
          var pb = HF.project(camera, new THREE.Vector3(0.3, 0.5, 0.05));
          HF.place(labBatt, pb.x + 60, pb.y - 130, false);
          HF.leader(camera, "s3-ld-batt", labBatt, new THREE.Vector3(0.3, 0.5, 0.05), 44.0, 45.7, t);
        }

        if (inB2 || inB4) {
          var heat = ease(HF.seg(t, 58.0, 64.5));
          slabMat.emissiveIntensity = heat * 0.7;
          glowC.material.opacity = heat * 0.5;
          var landed = 0;
          for (var i2 = 0; i2 < ions.length; i2++) {
            var im2 = ions[i2], f2 = ionPos(im2, t, tmpV);
            im2.position.copy(tmpV);
            im2.visible = t >= im2.userData.t0 - 0.05;
            if (f2 >= 1) {
              landed++;
              var v = 0.01 + 0.03 * heat;
              im2.position.x += v * Math.sin(t * 19 + im2.userData.ph);
              im2.position.y += v * Math.sin(t * 23 + im2.userData.ph * 2);
            }
            var sp = f2 >= 1 ? Math.exp(-(t - (im2.userData.t0 + 1.7)) * 3.0) : 0;
            im2.userData.spark.position.copy(im2.position);
            im2.userData.spark.material.opacity = 0.9 * sp * (inB2 ? 1 : 0);
          }
          var fillFrac = landed / ions.length;
          for (var s2 = 0; s2 < slabs.length; s2++) slabs[s2].position.x = (s2 - 3) * GAP * (1 + 0.04 * fillFrac) + Math.sin(t * 17 + s2) * 0.004 * heat;
          heatLight.position.set(0, 0.2, 1.8);
          heatLight.intensity = heat * 1.6;
          HF.updateParticles(partsC, t, heat, 1.6, 1.4);
          if (inB2) {
            var kk = ease(seg(t, 45.7, 53.2));
            gC.scale.setScalar(0.94 + 0.06 * easeOut(seg(t, 45.7, 46.15)));
            camera.position.set(Math.sin((t - 45.7) * 0.5) * 0.5, lerp(0.35, 0.2, kk), lerp(6.4, 5.2, kk));
            camTarget.set(0, 0.35, 0);
            camera.lookAt(camTarget);
            camera.updateMatrixWorld();
            // leaders: first flying ion, a slab
            var fly = ions[Math.min(ions.length - 1, Math.max(0, Math.floor(seg(t, 46.4, 51) * 40)))];
            var pi = HF.project(camera, fly.position);
            HF.place(labIon, pi.x - 110, pi.y - 40, true);
            HF.leader(camera, "s3-ld-ion", labIon, fly.position, 46.6, 53.2, t);
            var sp3 = HF.project(camera, new THREE.Vector3(slabs[5].position.x, -0.4, 0.45));
            HF.place(labGra, sp3.x + 100, sp3.y + 230, false);
            HF.leader(camera, "s3-ld-gra", labGra, new THREE.Vector3(slabs[5].position.x, -0.4, 0.45), 48.2, 53.2, t);
          } else {
            var pbk = ease(seg(t, 58.0, 59.4));
            gC.scale.setScalar(lerp(1, 0.62, pbk));
            var dist = lerp(5.2, 8.2, pbk);
            camera.position.set(Math.sin(t * 0.4) * 0.3, lerp(0.2, -1.25, pbk), dist);
            camTarget.set(0, lerp(0.35, -1.25, pbk), 0);
            camera.lookAt(camTarget);
          }
        }

        if (inB3) {
          var u = seg(t, 53.4, 57.6);
          var yy = u < 0.3 ? lerp(1.5, 0.45, ease(u / 0.3)) : lerp(0.45, -0.9, ease((u - 0.3) / 0.7));
          var inGap = HF.seg(yy, 0.5, 0.2) * (1 - HF.seg(yy, -0.6, -0.9));
          hero.position.set(0, yy, 0);
          hero.scale.set(1 - 0.28 * inGap, 1 + 0.18 * inGap, 1 - 0.28 * inGap);
          heroGlow.position.copy(hero.position);
          heroGlow.material.opacity = 0.75 * inGap;
          hMat.emissiveIntensity = 0.4 * inGap;
          gH.scale.setScalar(0.94 + 0.06 * easeOut(seg(t, 53.2, 53.65)));
          partsH.position.set(0, yy - 0.2, 0.1);
          HF.updateParticles(partsH, t, inGap, 0.9, 0.5);
          heatLight.position.set(0, yy, 1.6);
          heatLight.intensity = inGap * 0.7;
          camera.position.set(0.15 * Math.sin(t * 0.6), 0.2, 5.2);
          camTarget.set(0, 0.0, 0);
          camera.lookAt(camTarget);
          camera.updateMatrixWorld();
          var p1 = HF.project(camera, new THREE.Vector3(0.2, yy + 0.1, 0.1));
          HF.place(labIon2, p1.x + 160, p1.y - 130, false);
          HF.leader(camera, "s3-ld-ion2", labIon2, hero.position, 53.5, 58.0, t);
          var p2 = HF.project(camera, new THREE.Vector3(0.22, -0.2, 0.1));
          HF.place(labRes, p2.x - 90, p2.y + 90, true);
          HF.leader(camera, "s3-ld-res", labRes, new THREE.Vector3(0.22, -0.2, 0.1), 54.6, 58.0, t);
        }
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", function (e) { renderAt(e.detail.time); });
      renderAt(T0);

      var tl = gsap.timeline({ paused: true });
      var pop = function (sel, at) { tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, at); };
      pop("#s3-lab-batt", 1.54);
      pop("#s3-lab-ion", 4.14);
      pop("#s3-lab-gra", 5.74);
      pop("#s3-chip-full", 9.74);
      pop("#s3-lab-ion2", 11.04);
      pop("#s3-lab-res", 12.14);
      tl.fromTo("#s3-count", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 15.94);
      var cnt = { v: 1 };
      tl.to(cnt, { v: 1000000, duration: 5.2, ease: "power3.in", onUpdate: function () {
        var n = $("s3-num"); if (n) n.textContent = Math.round(cnt.v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      } }, 16.34);
      tl.fromTo("#s3-curve", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 5.2, ease: "power2.in" }, 16.34);
      window.__timelines["stage3"] = tl;
    })();

  </script>
</template>
