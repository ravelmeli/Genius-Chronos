<template>

  <script src="assets/vendor/three.min.js"></script>

  <script>

    (function () {
      var HF = window.HF, lerp = HF.lerp, ease = HF.ease, easeOut = HF.easeOut, seg = HF.seg, $ = HF.el;
      var T1 = 21.2;
      var renderer = HF.makeRenderer($("ma-canvas"));
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070b16);
      scene.fog = new THREE.Fog(0x070b16, 12, 30);
      var camera = new THREE.PerspectiveCamera(38, HF.W / HF.H, 0.1, 60);
      scene.add(new THREE.HemisphereLight(0x6f8cff, 0x120c08, 0.5));
      var key = new THREE.DirectionalLight(0xffd9b0, 0.9); key.position.set(2.5, 4, 3); scene.add(key);
      var rim = new THREE.DirectionalLight(0x5aa0ff, 0.8); rim.position.set(-3, 2.5, -3); scene.add(rim);
      var pl = new THREE.PointLight(0xffe2a0, 0, 6, 1.5); scene.add(pl);
      function std(c, o) { return new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.7, metalness: 0.1 }, o || {})); }
      function box(w, h, d, m, x, y, z) { var b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); return b; }
      var g = new THREE.Group(); scene.add(g);
      var steel = std(0x8a93a8, { metalness: 0.7, roughness: 0.4 });
      g.add(box(3.4, 0.1, 2.3, std(0x1a2236, { metalness: 0.3 }), 0, -0.05, 0));
      g.add(box(3.4, 1.9, 0.08, steel, 0, 0.95, -1.12));
      g.add(box(0.08, 1.9, 2.3, steel, -1.68, 0.95, 0));
      var ttable = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.05, 40), new THREE.MeshStandardMaterial({ color: 0x9fd0ff, transparent: true, opacity: 0.35, roughness: 0.1 })); ttable.position.y = 0.1; g.add(ttable);
      var bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.32, 0.4, 32, 1, true), new THREE.MeshStandardMaterial({ color: 0xe9ecf4, roughness: 0.5, side: THREE.DoubleSide })); bowl.position.set(0, 0.34, 0); g.add(bowl);
      var soupMat = new THREE.MeshStandardMaterial({ color: 0xb8742e, roughness: 0.5, emissive: 0xff5a00, emissiveIntensity: 0 });
      var soup = new THREE.Mesh(new THREE.CylinderGeometry(0.43, 0.43, 0.02, 32), soupMat); soup.position.set(0, 0.5, 0); g.add(soup);
      var steam = HF.makeParticles(70, 7, 0.12, 0xffffff); steam.position.set(0, 0.55, 0); g.add(steam);
      // magnetron
      var mag = new THREE.Group(); mag.position.set(1.3, 1.45, -0.7); g.add(mag);
      var mbody = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.34, 20), std(0xc9ccd8, { metalness: 0.8, roughness: 0.3 })); mbody.rotation.z = Math.PI / 2; mag.add(mbody);
      for (var f = 0; f < 6; f++) { var fin = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.02, 20), std(0xd98a4a, { metalness: 0.8, roughness: 0.3 })); fin.rotation.z = Math.PI / 2; fin.position.x = 0.2 + f * 0.04; mag.add(fin); }
      var mglow = HF.makeGlow(0xb26bff, 1.4); mglow.position.set(-0.25, 0, 0); mag.add(mglow);
      // fork
      var fk = HF.makeFork(); fk.group.position.set(1.0, 0.1 + 0.55, 0.5); fk.group.scale.setScalar(0.8); fk.group.visible = false; g.add(fk.group);
      var fglow = HF.makeGlow(0xcfe6ff, 1.4); g.add(fglow);
      var spk = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(function () { var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(HF.spark(new THREE.Vector3(), new THREE.Vector3(0, 0.1, 0), 1)), new THREE.LineBasicMaterial({ color: 0xfff1b8, transparent: true, opacity: 0 })); g.add(l); return l; });
      // waves
      var targets = [new THREE.Vector3(0, 0.6, 0), new THREE.Vector3(-0.9, 0.5, 0.3), new THREE.Vector3(0.1, 0.6, 0.7), new THREE.Vector3(-0.35, 0.6, -0.6)];
      var ribbons = targets.map(function () { var b = HF.makeBeads(60, 0xb26bff, 0.085); g.add(b); return b; });
      var labMag = $("ma-lab-mag"), ldMag = $("ma-ld-mag");
      var tmp = new THREE.Vector3();
      function renderAt(t) {
        if (t > T1 + 0.05) return;
        g.scale.setScalar(0.94 + 0.06 * easeOut(seg(t, 0, 0.5)));
        var heat = ease(seg(t, 1.0, 5.0)) * 0.45;
        soupMat.emissiveIntensity = heat;
        soupMat.color.setRGB(lerp(0.72, 0.95, heat * 2), lerp(0.45, 0.42, heat * 2), lerp(0.18, 0.12, heat * 2));
        HF.updateParticles(steam, t, ease(seg(t, 1.6, 3.0)), 1.2, 1.2);
        // fork and sparks
        fk.group.visible = t >= 5.8;
        fk.group.scale.setScalar(0.8 * easeOut(seg(t, 5.8, 6.2)));
        var on = t > 6.2 && t < 10.7 && (Math.sin(t * 37) + Math.sin(t * 53 + 1) > 0.35);
        var tips = fk.tips.map(function (v) { return v.clone().multiplyScalar(0.8).add(fk.group.position); });
        for (var i = 0; i < 9; i++) {
          var gap = i % 3;
          var pts = HF.spark(tips[gap], tips[gap + 1], Math.floor(t * 30) * 7 + i * 13);
          var pa = spk[i].geometry.attributes.position;
          for (var k = 0; k < pts.length; k++) pa.setXYZ(k, pts[k].x, pts[k].y, pts[k].z);
          pa.needsUpdate = true;
          spk[i].material.opacity = on ? 1 : 0;
        }
        fglow.position.copy(tips[1]).add(new THREE.Vector3(0.05, 0.05, 0.1));
        fglow.material.opacity = on ? 0.4 : 0.0;
        pl.position.copy(tips[1]); pl.intensity = on ? 1.8 : 0;
        // waves from the magnetron
        var wv = ease(seg(t, 11.2, 12.2));
        var A = new THREE.Vector3(1.05, 1.45, -0.7);
        ribbons.forEach(function (rb, i) {
          var B = targets[i];
          var dir = B.clone().sub(A).normalize();
          var perp = new THREE.Vector3(0, 1, 0).cross(dir).normalize().cross(dir).normalize();
          HF.setBeads(rb, A, B, perp, 0.11, 3.5, 7.5, t, 1);
          rb.material.opacity = 0.85 * wv;
        });
        mglow.material.opacity = 0.2 + 0.5 * wv * (0.5 + 0.5 * Math.sin(t * 8));
        var k2 = seg(t, 0, T1);
        camera.position.set(lerp(4.8, 4.0, k2), lerp(3.4, 2.8, k2), lerp(8.6, 7.6, k2));
        camera.lookAt(0, lerp(0.35, 0.7, k2), 0);
        camera.updateMatrixWorld();
        var pm = HF.project(camera, mag.position.clone().add(new THREE.Vector3(0.3, 0.3, 0)));
        HF.place(labMag, pm.x - 60, pm.y - 120, true);
        HF.leader(camera, "ma-ld-mag", labMag, mag.position.clone().add(new THREE.Vector3(0.1, 0.2, 0)), 11.4, 21.0, t);
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", function (e) { renderAt(e.detail.time); });
      renderAt(0);
      var tl = gsap.timeline({ paused: true });
      var pop = function (sel, at, d) { tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: d || 0.25, ease: "back.out(2)" }, at); };
      tl.fromTo("#ma-flame", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.6);
      pop("#ma-q1", 9.0, 0.3); pop("#ma-q2", 9.2, 0.3); pop("#ma-lab-mag", 11.4); pop("#ma-lab-radio", 14.4); pop("#ma-lab-hz", 17.4);
      window.__timelines["stageA"] = tl;
    })();

  </script>
