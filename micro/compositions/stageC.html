    (function () {

      var pl = new THREE.PointLight(0xfff1c0, 0, 7, 1.5); scene.add(pl);
      function std(c, o) { return new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.7, metalness: 0.1 }, o || {})); }
      var rnd = HF.mulberry32(63);

        w.group.rotation.z = ((x + y + z) % 2) * 1.57; w.O.material = w.O.material.clone(); w.O.material.color.set(0x7ac4ff); w.O.material.emissive.set(0x2a78d8); w.O.material.emissiveIntensity = 0.5;
        gI.add(w.group); ice.push(w);

      gI.position.set(0, 1.4, 0);
      var iceArrow = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.07, 0.07), new THREE.MeshBasicMaterial({ color: 0xb26bff, toneMapped: false })); iceArrow.position.set(0, 2.9, 0); scene.add(iceArrow);
      var sc = document.createElement("canvas"); sc.width = 480; sc.height = 280;
      var sg = sc.getContext("2d");
      var stex = new THREE.CanvasTexture(sc); stex.encoding = THREE.sRGBEncoding;
      var slice = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.5), new THREE.MeshBasicMaterial({ map: stex, toneMapped: false })); slice.position.set(0, -0.5, 0); scene.add(slice);
      var wavesDown = HF.makeBeads(50, 0xb26bff, 0.09); scene.add(wavesDown);
      function drawSlice(t) {

        gr.addColorStop(0, "rgba(255,90,20," + (0.95 * pen) + ")"); gr.addColorStop(0.28, "rgba(255,120,40," + (0.55 * pen) + ")"); gr.addColorStop(0.5, "rgba(255,150,60,0)");
        sg.fillStyle = gr; sg.fillRect(0, 0, 480, 280);
        var cond = ease(seg(t, 53.2, 55.0));
        var g2 = sg.createLinearGradient(0, 70, 0, 280);
        g2.addColorStop(0, "rgba(255,160,70," + (0.45 * cond) + ")"); g2.addColorStop(1, "rgba(255,160,70," + (0.18 * cond) + ")");
        sg.fillStyle = g2; sg.fillRect(0, 70, 480, 210);
        sg.strokeStyle = "rgba(255,255,255,0.7)"; sg.lineWidth = 4; sg.strokeRect(2, 2, 476, 276);
        stex.needsUpdate = true;
      }

      // ---------- M6 : turntable heat map ----------
      var hc = document.createElement("canvas"); hc.width = 128; hc.height = 128;
      var hg = hc.getContext("2d"); var himg = hg.createImageData(128, 128);
      var htex = new THREE.CanvasTexture(hc); htex.encoding = THREE.sRGBEncoding;
      var disc = new THREE.Mesh(new THREE.CircleGeometry(1.35, 64), new THREE.MeshBasicMaterial({ map: htex, toneMapped: false })); disc.position.set(0, 0.7, 0); disc.rotation.x = -0.5; scene.add(disc);
      var notch = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false })); scene.add(notch);
      function ramp(v) { v = HF.clamp(v, 0, 1); var r, g, b; if (v < 0.5) { var u = v / 0.5; r = lerp(0.1, 0.35, u); g = lerp(0.2, 0.15, u); b = lerp(0.7, 0.55, u); } else { var u2 = (v - 0.5) / 0.5; r = lerp(0.35, 1.0, u2); g = lerp(0.15, 0.85 * u2 + 0.15, u2); b = lerp(0.55, 0.1, u2); } return [r * 255, g * 255, b * 255]; }
      function drawHeat(t) {
        var mix = ease(seg(t, 58.6, 60.6));
        var th = ease(seg(t, 58.3, 61.1)) * 9.4;
        for (var j = 0; j < 128; j++) for (var i = 0; i < 128; i++) {
          var x = (i / 127) * 2 - 1, y = (j / 127) * 2 - 1;
          var r2 = x * x + y * y;
          var idx = (j * 128 + i) * 4;
          if (r2 > 1) { himg.data[idx + 3] = 0; continue; }
          var c = Math.cos(th), s = Math.sin(th);
          var xo = x * c - y * s, yo = x * s + y * c;
          var v = Math.pow(Math.cos(3.1 * xo + 0.7), 2) * Math.pow(Math.cos(2.7 * yo - 0.4), 2);
          var avg = 0.42 + 0.1 * (1 - r2);
          var vv = lerp(v, avg, mix);
          var col = ramp(vv);
          himg.data[idx] = col[0]; himg.data[idx + 1] = col[1]; himg.data[idx + 2] = col[2]; himg.data[idx + 3] = 255;
        }
        hg.putImageData(himg, 0, 0); htex.needsUpdate = true;
      }

      // ---------- M7 : fork and sparks ----------
      var gF = new THREE.Group(); scene.add(gF);
      var fk = HF.makeFork(); fk.group.scale.setScalar(1.8); fk.group.position.set(0, -0.3, 0); gF.add(fk.group);
      var elec = [];
      for (var e = 0; e < 40; e++) {
        var m = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffc41a, toneMapped: false }));
        var yb = -1.4 + rnd() * 2.0, xb = (rnd() - 0.5) * (yb > -0.15 ? 0.34 : 0.1);
        m.userData = { yb: yb, xb: xb, ph: rnd() * 6.28, tip: Math.floor(rnd() * 4) };

      var fieldB = HF.makeBeads(70, 0xb26bff, 0.09); scene.add(fieldB);
      var airGlow = HF.makeGlow(0xcfe6ff, 2.4); gF.add(airGlow);
      var sparkL = [0, 1, 2, 3, 4, 5].map(function () { var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(HF.spark(new THREE.Vector3(), new THREE.Vector3(0, 0.1, 0), 1)), new THREE.LineBasicMaterial({ color: 0xfff1b8, transparent: true, opacity: 0 })); gF.add(l); return l; });

      var labIce = $("mc-lab-ice"), labCm = $("mc-lab-cm"), labStrong = $("mc-lab-strong"), labWeak = $("mc-lab-weak"), labTip = $("mc-lab-tip");
      var ld = { ice: $("mc-ld-ice"), pen: $("mc-ld-pen"), strong: $("mc-ld-strong"), weak: $("mc-ld-weak"), tip: $("mc-ld-tip") };
      var tmp = new THREE.Vector3();
      function pj(v) { return HF.project(camera, v); }
      function renderAt(t) {
        if (t < T0 - 0.05 || t > T1 + 0.05) return;
        Object.keys(ld).forEach(function (k) { ld[k].setAttribute("opacity", "0"); });
        var a = t < 55.1, b = t >= 55.1 && t < 61.16, c = t >= 61.16;

        disc.visible = b; notch.visible = b; gF.visible = c; fieldB.visible = c; pl.intensity = 0;
        if (a) {
          gI.scale.setScalar(0.94 + 0.06 * easeOut(seg(t, 46.7, 47.2)) );
          var sq = 1.0 - 0.0;
          ice.forEach(function (w, i) { w.group.position.x += 0; w.group.rotation.z = ((i % 2) * 1.57) + 0.02 * Math.sin(t * 6 + i); });
          var dir = Math.sin(t * 3.0) >= 0 ? 1 : -1;
          iceArrow.scale.x = dir;
          // the whole block is dimmed once the slice appears
          gI.position.y = lerp(1.4, 2.0, ease(seg(t, 50.7, 51.5))); gI.scale.setScalar(lerp(1, 0.7, ease(seg(t, 50.7, 51.5))));
          iceArrow.position.y = lerp(2.9, 3.1, ease(seg(t, 50.7, 51.5)));
          if (t > 50.7) {
            slice.position.set(0, -0.7, 0);
            drawSlice(t);
            HF.setBeads(wavesDown, new THREE.Vector3(0, 0.55, 0.05), new THREE.Vector3(0, -0.2, 0.05), new THREE.Vector3(1, 0, 0), 0.16, 2.0, 7, t, 1);
            wavesDown.material.opacity = 0.85 * ease(seg(t, 50.9, 51.4));
          }
          camera.position.set(0, 0.5, 8.2);
          camera.lookAt(0, 0.6, 0);
          camera.updateMatrixWorld();
          var pi = pj(gI.localToWorld(new THREE.Vector3(1.0, 0.5, 0.3)));
          HF.place(labIce, pi.x + 40, pi.y - 150 + (t > 50.7 ? 100 : 0), t > 50.7);
          HF.leader(camera, "mc-ld-ice", labIce, gI.localToWorld(new THREE.Vector3(1.0, 0.5, 0.3)), 46.9, 55.0, t);
          var pp = pj(new THREE.Vector3(1.0, -0.45, 0.1));
          HF.place(labCm, pp.x - 30, pp.y - 30, true);
          HF.leader(camera, "mc-ld-pen", labCm, new THREE.Vector3(1.2, -0.45, 0.1), 51.2, 55.0, t);
        }
        if (b) {

          drawHeat(t);
          var th = ease(seg(t, 58.3, 61.1)) * 9.4;
          notch.position.set(Math.cos(th) * 1.28, 0.7 + Math.sin(th) * 1.28 * Math.cos(0.5), Math.sin(th) * 1.28 * Math.sin(0.5) * 0.0 + 0.02);
          camera.position.set(0, 0.9, 7.6);
          camera.lookAt(0, 0.9, 0);
          camera.updateMatrixWorld();
          var p1 = pj(new THREE.Vector3(-0.5, 0.9, 0.1)), p2 = pj(new THREE.Vector3(0.6, 0.35, 0.1));
          HF.place(labStrong, p1.x - 50, p1.y - 270, true);
          HF.leader(camera, "mc-ld-strong", labStrong, new THREE.Vector3(-0.5, 0.9, 0.1), 56.0, 61.1, t);
          HF.place(labWeak, p2.x + 80, p2.y + 200, false);
          HF.leader(camera, "mc-ld-weak", labWeak, new THREE.Vector3(0.6, 0.35, 0.1), 57.2, 61.1, t);
        }
        if (c) {
          gF.scale.setScalar(0.94 + 0.06 * easeOut(seg(t, 61.2, 61.7)));
          var om = 3.2, field = Math.sin(om * (t - 61.2));
          var acc = ease(seg(t, 64.4, 71.0));
          var tipsW = fk.tips.map(function (v) { return v.clone().multiplyScalar(1.8).add(fk.group.position); });
          elec.forEach(function (m, i) {
            var u = m.userData;
            var ytip = tipsW[u.tip].y - 0.05 + 0.0;
            var y = lerp(u.yb, ytip - (i % 3) * 0.06, acc * (u.yb > -0.3 ? 1 : 0.6));
            var x = lerp(u.xb, tipsW[u.tip].x + (i % 2 ? 0.015 : -0.015), acc);
            m.position.set(x, y + 0.05 * field * (1 - acc) + 0.012 * Math.sin(t * 20 + u.ph), 0.05);
          });
          HF.setBeads(fieldB, new THREE.Vector3(-2.2, 0.2, -0.4), new THREE.Vector3(2.2, 0.2, -0.4), new THREE.Vector3(0, 1, 0), 0.25, 2.2, om * 2, t, 1);
          fieldB.material.opacity = 0.8 * ease(seg(t, 62.0, 62.8));
          var vv = ease(seg(t, 69.9, 73.5));
          var air = ease(seg(t, 72.2, 73.9));
          var on = t > 73.98 && t < 75.5 && (Math.sin(t * 41) + Math.sin(t * 57 + 1) > -0.2);
          airGlow.position.set(0, tipsW[1].y, 0.1); airGlow.material.opacity = 0.5 * air + (on ? 0.5 : 0);
          for (var i = 0; i < 6; i++) {

            var pa = sparkL[i].geometry.attributes.position;
