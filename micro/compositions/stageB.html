      function std(c, o) { return new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.7, metalness: 0.1 }, o || {})); }
      var rnd = HF.mulberry32(41);

      var head = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.34, 14), new THREE.MeshBasicMaterial({ color: 0xb26bff, toneMapped: false })); head.rotation.z = -Math.PI / 2; head.position.x = 0.8; arrow.add(head);
      arrow.position.set(0, 2.1, 0); scene.add(arrow);
      var fieldBeads = HF.makeBeads(90, 0xb26bff, 0.09); scene.add(fieldBeads);
      // swarm of small molecules
      var N = 60, swarm = [];
      var sg = new THREE.Group(); scene.add(sg);

        var w = HF.makeWater(0.2);
        w.group.userData = { x: (rnd() - 0.5) * 2.4, y: (rnd() - 0.5) * 1.4, z: (rnd() - 0.5) * 0.8, ph: rnd() * 6.28, sp: 4 + rnd() * 6 };
        w.O = w.O; sg.add(w.group); swarm.push(w);

      // soup bowl and dry plate

      var steam = HF.makeParticles(60, 3, 0.1, 0xffffff); steam.position.set(-0.8, -0.7, 0); objs.add(steam);

      var labH2O = $("mb-lab-h2o"), labPlus = $("mb-lab-plus"), labMinus = $("mb-lab-minus"), labFric = $("mb-lab-fric"), labSoup = $("mb-lab-soup"), labDry = $("mb-lab-dry");
      var ld = { plus: $("mb-ld-plus"), minus: $("mb-ld-minus"), sw: $("mb-ld-sw"), soup: $("mb-ld-soup"), dry: $("mb-ld-dry") };
      var tmp = new THREE.Vector3();

      function renderAt(t) {

          big.group.scale.setScalar(Math.max(0.001, pop) * 1.7);
          var om = 3.0;
          var active = ease(seg(t, 31.0, 31.6));
          var dirS = Math.tanh(3 * Math.sin(om * (t - 31.0))) * active;
          big.group.rotation.z = (Math.PI / 2) * dirS;
          arrow.scale.x = dirS >= 0 ? 1 : -1; arrow.position.x = 0;
          arrow.scale.x = Math.sign(dirS || 1);
          var wob = 0.03 * Math.sin(t * 2.1);
          big.group.position.set(0, 0.7 + wob, 0);
          // field wave behind the molecule
          var A = new THREE.Vector3(-2.2, 2.9, -0.6), B = new THREE.Vector3(2.2, 2.9, -0.6);
          HF.setBeads(fieldBeads, A, B, new THREE.Vector3(0, 1, 0), 0.22 * active, 2.2, om * 2, t, 1);
          fieldBeads.material.opacity = 0.8 * active;
          camera.position.set(0, 0.7, 8.2);
          camera.lookAt(0, 0.9, 0);
          camera.updateMatrixWorld();
          var rot = big.group.rotation.z;
          var hp = new THREE.Vector3(0, -0.36 * 1.7, 0.2).applyAxisAngle(new THREE.Vector3(0, 0, 1), rot).add(big.group.position);
          var op = new THREE.Vector3(0, 0.35 * 1.7, 0.2).applyAxisAngle(new THREE.Vector3(0, 0, 1), rot).add(big.group.position);
          var pa = pj(hp), pb = pj(op), pc = pj(big.group.position);
          HF.place(labPlus, pa.x + 260, pa.y + 140, false);
          HF.leader(camera, "mb-ld-plus", labPlus, hp, 26.0, 37.6, t);
          HF.place(labMinus, pb.x + 260, pb.y - 160, false);
          HF.leader(camera, "mb-ld-minus", labMinus, op, 27.5, 37.6, t);
                    arrow.visible = m1 && t > 30.9;
          arrow.position.set(0, 2.1, 0.1);
        } else {

          sg.scale.setScalar(0.94 + 0.06 * easeOut(seg(t, 38.0, 38.5)));
          swarm.forEach(function (w, i) {
            var u = w.group.userData;
            var amp = 0.05 + 0.13 * heat;
            w.group.position.set(u.x + amp * Math.sin(t * u.sp + u.ph), u.y + amp * Math.cos(t * u.sp * 1.3 + u.ph), u.z);
            w.group.rotation.z = 1.4 * Math.sin(t * 5 + u.ph) * (0.5 + heat);
            w.O.material.color.setRGB(lerp(1.0, 1.0, heat), lerp(0.29, 0.62, heat), lerp(0.29, 0.1, heat));
            w.O.material.emissive.setRGB(1, 0.35, 0.05); w.O.material.emissiveIntensity = heat * 1.1;
          });
          HF.updateParticles(sparks, t * 1.5, heat * 0.9, 1.0, 5.0);
          sglow.material.opacity = heat * 0.35;
          soupMat.emissiveIntensity = heat * 0.8;
          soupMat.color.setRGB(lerp(0.42, 0.9, heat), lerp(0.44, 0.45, heat), lerp(0.53, 0.14, heat));
          HF.updateParticles(steam, t, ease(seg(t, 43.4, 44.6)), 1.0, 1.0);
          hl.position.set(0, 1.0, 3); hl.intensity = heat * 1.2;
